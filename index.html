<style>
:root{--ground:#131A22;--surface:#1B242F;--surface2:#222D3A;--paper:#EDE8DF;--dim:#8A97A6;
--amber:#E8A33D;--red:#E4574A;--moss:#63A46C;--line:#2C3A49;--cyan:#5BA8C4;--violet:#9B8BC4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC","Segoe UI",sans-serif;font-size:16px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:rgba(19,26,34,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 9px) 0 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 9px}
.brand b{font-size:16px;font-weight:650}
.clock{display:flex;align-items:center;gap:7px}
.clock .jst{font-size:19px;font-weight:600;color:var(--amber)}
.clock .zn{font-size:10.5px;color:var(--dim);line-height:1.15;text-align:right}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 9px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 13px;font-size:13.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
nav button .d{font-size:10.5px;display:block;line-height:1.2;opacity:.7}
nav button[aria-selected="true"]{background:var(--paper);color:var(--ground);border-color:var(--paper);font-weight:600}
nav button.today{border-color:var(--cyan);color:var(--cyan)}
#live{padding:11px 16px;border-bottom:1px solid rgba(91,168,196,.4);background:linear-gradient(180deg,rgba(91,168,196,.18),rgba(91,168,196,.06))}
#live.late{border-bottom-color:rgba(228,87,74,.5);background:linear-gradient(180deg,rgba(228,87,74,.2),rgba(228,87,74,.06))}
#live .l1{font-size:11.5px;color:var(--cyan);font-weight:700;letter-spacing:.06em;display:flex;justify-content:space-between}
#live.late .l1{color:var(--red)}
#live .l2{font-size:21px;font-weight:700;margin:3px 0 3px;line-height:1.3}
#live .l3{font-size:12.5px;color:#B5C2CE}

#live .pb{height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:7px 0 5px;overflow:hidden}

#live.late .pb i{background:var(--red)}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);object-fit:cover;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.avwrap{position:relative;flex:0 0 auto}
.avwrap input{position:absolute;inset:0;opacity:0;cursor:pointer}
main{padding:0 16px 70px;max-width:640px;margin:0 auto}
.crux{margin:14px 0 10px;padding:9px 12px;border:1px solid rgba(228,87,74,.55);border-radius:4px;background:rgba(228,87,74,.09);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.crux .lab{color:var(--red);font-size:10.5px;font-weight:700;letter-spacing:.06em;flex:0 0 auto}
.crux .t{font-size:19px;font-weight:700;color:var(--red);flex:0 0 auto}
.crux .w{font-size:13.5px;flex:1 1 auto;min-width:120px}
.crux .n{font-size:11.5px;color:var(--dim);flex:1 0 100%}
.wx{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 13px;margin-bottom:12px;font-size:13.5px}
.wx .ic{font-size:24px}
.wx .tx{flex:1}
.wx .tx b{font-size:15px}
.wx .tx small{display:block;color:var(--dim);font-size:12px}
.bar{display:flex;gap:7px;margin:0 0 14px;flex-wrap:wrap}
.bar button{flex:1 1 auto;background:var(--surface);border:1px solid var(--line);color:var(--paper);border-radius:4px;padding:9px 10px;font-size:13px;font-family:inherit;cursor:pointer}
.bar button.pri{background:var(--cyan);color:var(--ground);border-color:var(--cyan);font-weight:650}
.slot{display:grid;grid-template-columns:60px 1fr;gap:11px;position:relative}
.slot .rail{position:relative}
.slot .rail::before{content:"";position:absolute;left:calc(100% + 5px);top:9px;bottom:-6px;width:1px;background:var(--line)}
.slot:last-child .rail::before{display:none}
.slot .tm{font-size:15px;font-weight:600;color:var(--amber)}
.slot .te{font-size:11.5px;color:var(--dim)}
.slot .eta{font-size:11px;color:var(--red);font-weight:600;margin-top:2px}
.slot.past{opacity:.42}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 13px;margin-bottom:10px}
.card.dead{border-left:3px solid var(--red);background:var(--surface2)}
.card.eat{border-left:3px solid var(--moss)}
.card.move{border-left:3px solid var(--violet)}
.card.adhoc{border-style:dashed;border-color:var(--cyan)}
.card.now{box-shadow:0 0 0 2px var(--cyan);border-color:var(--cyan)}
.card.ok{opacity:.55}
.nowtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ground);background:var(--cyan);border-radius:3px;padding:1px 6px;margin-bottom:5px}
.hd{display:flex;align-items:flex-start;gap:8px}
.hd h3{margin:0;font-size:15px;font-weight:600;flex:1;line-height:1.4;cursor:pointer}
.chev{color:var(--dim);font-size:12px;margin-top:3px}
.card.open .chev{transform:rotate(90deg)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:3px;background:#2A3746;color:var(--dim)}
.tag.r{background:rgba(228,87,74,.2);color:#F09A90}
.tag.a{background:rgba(232,163,61,.18);color:var(--amber)}
.tag.g{background:rgba(99,164,108,.18);color:#8FCB97}
.tag.v{background:rgba(155,139,196,.2);color:#C4B8E0}
.tag.c{background:rgba(91,168,196,.2);color:var(--cyan)}
.lk{font-size:11.5px;padding:3px 9px;border-radius:3px;text-decoration:none;border:1px solid;display:inline-block;font-family:inherit;cursor:pointer}
.lk.map{background:rgba(91,168,196,.16);color:var(--cyan);border-color:rgba(91,168,196,.35)}
.lk.dir{background:rgba(155,139,196,.16);color:#C4B8E0;border-color:rgba(155,139,196,.4)}
.lk.food{background:rgba(99,164,108,.14);color:#8FCB97;border-color:rgba(99,164,108,.35)}
.lk.web{background:rgba(232,163,61,.13);color:var(--amber);border-color:rgba(232,163,61,.3)}
.lk.ed{background:#2A3746;color:var(--paper);border-color:var(--line)}
.lk.rm{background:rgba(228,87,74,.14);color:#F09A90;border-color:rgba(228,87,74,.3)}
.lk.go{background:var(--moss);color:#0E1712;border-color:var(--moss);font-weight:700}
.lk.gone{background:rgba(99,164,108,.16);color:#8FCB97;border-color:rgba(99,164,108,.4)}
.body{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:14px;color:#C9D2DC}
.card.open .body{display:block}
.body ul{margin:0;padding-left:17px}.body li{margin:4px 0}
.body b{color:var(--paper)}.body .warn{color:#F09A90}
.form{background:var(--surface2);border:1px dashed var(--cyan);border-radius:4px;padding:13px;margin:0 0 14px}
.form h4{margin:0 0 9px;font-size:13.5px;color:var(--cyan);font-weight:650}
.form .row{display:flex;gap:7px;margin-bottom:7px}

.form input.t{flex:0 0 84px;text-align:center}
.form input::placeholder{color:#5C6B7C}
.form .btns{display:flex;gap:7px}

.form .cx{flex:0 0 84px;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:3px;padding:10px;font-size:14px;font-family:inherit;cursor:pointer}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}

.who input{display:none}
.who input:checked+span{color:var(--cyan);font-weight:600}
.who label:has(input:checked){border-color:var(--cyan);background:rgba(91,168,196,.12)}
h2.sec{font-size:13px;font-weight:700;color:var(--amber);margin:26px 0 10px;letter-spacing:.04em}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:7px;cursor:pointer}
.chk input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--moss);flex:0 0 auto}
.chk .x{flex:1;font-size:14px}
.chk .x small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.chk.done .x{opacity:.42;text-decoration:line-through}
.tel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:7px;color:var(--paper);text-decoration:none}
.tel .n{font-size:14.5px}.tel .n small{display:block;color:var(--dim);font-size:12px}
.tel .num{font-size:14px;color:var(--amber);white-space:nowrap}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:4px;padding:12px;font-size:13.5px;color:#C9D2DC;margin-bottom:10px}
.note b{color:var(--paper)}
.hotel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px;margin-bottom:10px}
.hotel h4{margin:0 0 3px;font-size:15px}
.hotel .sub{font-size:12.5px;color:var(--dim);margin-bottom:9px}
.store{font-size:11.5px;padding:6px 10px;border-radius:4px;margin-bottom:12px;text-align:center}
.store.on{background:rgba(99,164,108,.14);color:#8FCB97;border:1px solid rgba(99,164,108,.3)}
.store.off{background:rgba(228,87,74,.12);color:#F09A90;border:1px solid rgba(228,87,74,.3)}
.exp{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:7px}
.exp .l{flex:1;font-size:14px}
.exp .l small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.exp .r{text-align:right;white-space:nowrap}
.exp .r b{font-size:15px;color:var(--amber)}
.exp .r button{display:block;margin-top:4px;font-size:11px;background:transparent;border:0;color:#F09A90;cursor:pointer;font-family:inherit}
.bal{display:flex;justify-content:space-between;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:6px;font-size:14px}
.bal .p{font-size:15px;font-weight:600}
.bal .plus{color:#8FCB97}.bal .minus{color:#F09A90}
.mem{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.mem input{flex:1;background:var(--ground);border:1px solid var(--line);color:var(--paper);border-radius:3px;padding:9px 10px;font-size:14px;font-family:inherit}
.mem span{color:var(--dim);font-size:13px;width:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--paper);color:var(--ground);padding:10px 18px;border-radius:4px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88%;text-align:center}
.toast.on{opacity:1}
footer{color:var(--dim);font-size:12px;text-align:center;padding:28px 0 10px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>

function toast(m){toastEl.innerHTML=m;toastEl.classList.add('on');setTimeout(function(){toastEl.classList.remove('on')},2200)}
Object.keys(D).forEach(function(k){var v=D[k],b=document.createElement('button');b.setAttribute('role','tab');
 b.innerHTML=(k==='prep'||k==='split')?v.label:v.label+'<span class="d">'+v.date.slice(0,5)+'</span>';
 b.onclick=function(){cur=k;editing=null;render()};b.dataset.k=k;nav.appendChild(b)});

function slotsOf(k){var out=[];
 D[k].s.forEach(function(s,i){var id='b'+i;if(ST.hide[k+':'+id])return;
  var o={};for(var p in s)o[p]=s[p];o.id=id;
  var e=ST.edit[k][id];if(e){for(var p2 in e)o[p2]=e[p2];o.edited=true}out.push(o)});
 (ST.adhoc[k]||[]).forEach(function(x,i){var id='a'+i;if(ST.hide[k+':'+id])return;
  var o={};for(var p in x)o[p]=x[p];o.id=id;o.adhoc=true;out.push(o)});
 return out.sort(function(p,q){return toMin(p.a)-toMin(q.a)})}

/* 落後計算：取最後一個打卡的項目，比較實際 vs 表定 */
function delayOf(k){var dn=ST.done[k]||{},list=slotsOf(k),last=null;
 list.forEach(function(s){if(dn[s.id]!==undefined)last={s:s,at:dn[s.id]}});
 if(!last)return null;
 var d=last.at-toMin(last.s.a);
 return {min:d,slot:last.s}}

function fetchWX(){
 /* 免費預報只到未來約 16 天，太遠就別打，否則伺服器回 400 */
 var j=jstNow(),start=new Date(2026,10,13);
 var days=Math.round((start-new Date(j.getFullYear(),j.getMonth(),j.getDate()))/86400000);
 if(days>15){WXFAR=days;return}
 WXFAR=0;
 var pts={};Object.keys(D).forEach(function(k){if(D[k].lat)pts[D[k].lat+','+D[k].lon]=1});
 Object.keys(pts).forEach(function(p){
  var c=p.split(',');
  var u="https://api.open-meteo.com/v1/forecast?latitude="+c[0]+"&longitude="+c[1]+
   "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date=2026-11-13&end_date=2026-11-17";
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){
   if(!o.daily)return;WX[p]=o.daily;if(D[cur]&&D[cur].lat)render()}).catch(function(){})})}

function wxFor(k){var v=D[k];if(!v.lat)return null;var w=WX[v.lat+','+v.lon];if(!w)return null;
 var d="2026-11-"+pad(v.dnum),i=w.time.indexOf(d);if(i<0)return null;
 var c=WMO[w.weather_code[i]]||["🌡️","—"];
 return {ic:c[0],txt:c[1],hi:Math.round(w.temperature_2m_max[i]),lo:Math.round(w.temperature_2m_min[i]),pop:w.precipitation_probability_max[i]}}

function updLive(){
 var j=jstNow();document.getElementById('jst').textContent=pad(j.getHours())+':'+pad(j.getMinutes());
 var tk=todayKey();
 [].forEach.call(nav.children,function(b){b.classList.toggle('today',b.dataset.k===tk)});
 live.style.display='block';
 if(!tk){
  var start=new Date(2026,10,13),now=new Date(j.getFullYear(),j.getMonth(),j.getDate());
  var dd=Math.round((start-now)/86400000);
  live.classList.remove('late');
  live.innerHTML='<div class="l1"><span>出發倒數</span></div><div class="l2">'+(dd>0?'還有 '+dd+' 天':(dd<0?'旅程已結束':'今天出發'))+'</div>'+
   '<div class="l3">2026/11/13（五）02:30 桃園起飛 ・ 最近死線：10/13 買 Pass、10/14 09:00 搶橋立</div>';
  return}
 var list=slotsOf(tk),nowM=j.getHours()*60+j.getMinutes(),ci=-1,ni=-1;
 for(var i=0;i<list.length;i++){var A=toMin(list[i].a),B=toMin(list[i].b);if(B<A)B+=1440;
  if(nowM>=A&&nowM<B){ci=i;break}if(nowM<A){ni=i;break}}
 var v=D[tk],dl=delayOf(tk),n=list.length;
 var idx=ci>=0?ci:(ni>=0?ni:n-1),stage=idx+1;
 var pct=Math.round(stage/n*100);
 var lateTxt='';
 if(dl&&dl.min>=5){live.classList.add('late');
  var nd=null;list.forEach(function(s){if(!nd&&s.dead&&toMin(s.a)>nowM)nd=s});
  lateTxt='<div class="l3" style="color:#F09A90;margin-top:4px">⚠️ <b style="color:#F09A90">落後 '+dl.min+' 分鐘</b>'+
   (nd?' ・ '+nd.t+' 預估 <b style="color:#F09A90">'+m2s(toMin(nd.a)+dl.min)+'</b>（表定 '+nd.a+'）':'')+'</div>'}
 else if(dl&&dl.min<=-5){live.classList.remove('late');lateTxt='<div class="l3" style="color:#8FCB97;margin-top:4px">✅ 比表定快 '+(-dl.min)+' 分鐘</div>'}
 else live.classList.remove('late');
 var head='<div class="l1"><span>'+(ci>=0?'現在應該在':'空檔中')+' ・ '+v.label+'</span><span>階段 '+stage+' / '+n+'</span></div>';
 var pbar='<div class="pb"><i style="width:'+pct+'%"></i></div>';
 if(ci>=0){var s0=list[ci],B2=toMin(s0.b);if(B2<toMin(s0.a))B2+=1440;var nx=list[ci+1];
  live.innerHTML=head+'<div class="l2">'+s0.t+'</div>'+pbar+
   '<div class="l3">剩 <b>'+(B2-nowM)+' 分鐘</b>'+(nx?' ・ 下一站 <b>'+nx.a+'</b> '+nx.t:' ・ 今天最後一站')+'</div>'+lateTxt}
 else if(ni>=0){var s2=list[ni];
  live.innerHTML=head+'<div class="l2">下一站：'+s2.t+'</div>'+pbar+
   '<div class="l3">還有 <b>'+(toMin(s2.a)-nowM)+' 分鐘</b>（'+s2.a+' 開始） ・ 今日最硬 <b>'+v.crux.t+'</b></div>'+lateTxt}
 else live.innerHTML=head+'<div class="l2">今天的行程已結束</div>'+pbar+lateTxt}

function wxAlert(){

  var v=D[k];
  out+='<div class="note" style="border-left-color:var(--red)"><b>☔ '+v.label+'（'+v.date+'）'+v.wxc+' 降雨機率 '+w.pop+'%</b><br>'+
   (k==='d2'?'傘松視野會歸零，強風還會讓<b>船與纜車全部停駛</b>。考慮改玩京都：嵐山＋錦市場（Pass 涵蓋）。'

function openForm(id){

 if(editing===id&&w.innerHTML){w.innerHTML='';editing=null;return}
 editing=id;var cu={a:'',b:'',t:'',q:''};
 if(id){var l=slotsOf(cur);for(var i=0;i<l.length;i++)if(l[i].id===id){cu.a=l[i].a;cu.b=l[i].b;cu.t=l[i].t.replace(/^[^\s]*\s/,'');cu.q=l[i].q||''}}
 w.innerHTML='<div class="form"><h4>'+(id?'替換這一項':'新增一站')+'</h4>'+
 '<div class="row"><input class="t mono" id="ia" placeholder="14:00" maxlength="5" value="'+cu.a+'"><input class="t mono" id="ib" placeholder="15:00" maxlength="5" value="'+cu.b+'"></div>'+
 '<div class="row"><input id="it" placeholder="要去哪／做什麼" value="'+cu.t.replace(/"/g,'&quot;')+'"></div>'+
 '<div class="row"><input id="iq" placeholder="地址或地圖關鍵字（選填）" value="'+cu.q.replace(/"/g,'&quot;')+'"></div>'+

 '<div class="btns"><button class="go" id="iok">'+(id?'替換':'加入')+'</button><button class="cx" id="ix">取消</button></div>'+
 '<div class="hint">這是<b>你（'+meName()+'）的個人調整，只會出現在你的手機上</b>，不會改到其他四個人的行程。按「還原」可以隨時回到原始版本。</div></div>';
 document.getElementById('ix').onclick=function(){w.innerHTML='';editing=null};
 document.getElementById('iok').onclick=function(){
  var g=function(x){return document.getElementById(x).value.trim()};

  if(!/^\d{1,2}:\d{2}$/.test(a)||!/^\d{1,2}:\d{2}$/.test(b))return toast('時間格式要像 14:00');

  var o={a:a,b:b,t:'📍 '+t,q:g('iq')||'',by:(ST.me===null?'':mem(ST.me))};if(g('in'))o.x='<ul><li>'+g('in')+'</li></ul>';
  if(id&&id.charAt(0)==='b')ST.edit[cur][id]=o;

  else ST.adhoc[cur].push(o);
  save();editing=null;render();toast(id?'已替換':'已加入')}}

function copyDay(k,list){var v=D[k],dn=ST.done[k]||{};
 var txt='【'+v.label+' '+v.date+'】'+v.title+'\n今日最硬：'+v.crux.t+' '+v.crux.w+'\n\n'+
  list.map(function(s){return s.a+'-'+s.b+'  '+s.t+((s.g&&s.g.length)?'  ['+s.g.join('/')+']':'')+(s.q?'\n        📍 '+s.q:'')+(s.adhoc?'  ←臨時':(s.edited?'  ←已改':''))}).join('\n');
 var hid=Object.keys(ST.hide).filter(function(x){return x.indexOf(k+':')===0});
 if(hid.length)txt+='\n\n（已刪除 '+hid.length+' 項）';
 function done(){toast('已複製 '+v.label+'<br><span style="font-weight:400">貼給我，我幫你更新手冊</span>')}
 function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity=0;
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('複製失敗')}document.body.removeChild(ta)}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done)['catch'](fb);else fb()}

function pickAvatar(i,file){
 if(!file)return;var fr=new FileReader();
 fr.onload=function(){var im=new Image();im.onload=function(){
  var c=document.createElement('canvas'),n=96;c.width=n;c.height=n;var g=c.getContext('2d');
  var side=Math.min(im.width,im.height);
  g.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,n,n);
  ST.avatars[i]=c.toDataURL('image/jpeg',0.7);save();render();toast('已更新大頭貼')};im.src=fr.result};

function icsEsc(t){return String(t).replace(/[\\;,]/g,function(m){return '\\'+m}).replace(/\n/g,'\\n')}
function pad2(n){return String(n).padStart(2,'0')}
/* JST 轉 UTC 字串 */
function jstStamp(dnum,hhmm,offMin){
 var p=hhmm.split(':'),mm=(+p[0])*60+(+p[1])-(offMin||0);
 var d=new Date(Date.UTC(2026,10,dnum,0,0,0));
 d=new Date(d.getTime()+(mm-540)*60000);
 return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+'T'+pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+'00Z'}

function makeICS(k,only){
 var v=D[k],list=slotsOf(k),ev=[];
 list.forEach(function(s,i){
  if(only&&!s.dead)return;
  var st=jstStamp(v.dnum,s.a,0),en=jstStamp(v.dnum,s.b,0);
  var al=s.dead?[30,10]:[10];
  var body=['BEGIN:VEVENT','UID:kansai-'+k+'-'+s.id+'@trip','DTSTAMP:'+jstStamp(v.dnum,s.a,0),
   'DTSTART:'+st,'DTEND:'+en,

/* ---- 極簡 QR (Model 2, byte mode, EC-L) ---- */
var QR=(function(){
 var EXP=[],LOG=[];(function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(var i2=255;i2<512;i2++)EXP[i2]=EXP[i2-255]})();
 function gmul(a,b){if(!a||!b)return 0;return EXP[(LOG[a]+LOG[b])%255]}
 function genPoly(n){var p=[1];for(var i=0;i<n;i++){var np=[];for(var j=0;j<=p.length;j++){var v=0;if(j<p.length)v^=p[j];if(j>0)v^=gmul(p[j-1],EXP[i]);np[j]=v}p=np}return p}
 function rs(data,ecLen){var res=data.slice().concat(new Array(ecLen).fill(0)),g=genPoly(ecLen);
  for(var i=0;i<data.length;i++){var c=res[i];if(!c)continue;for(var j=0;j<g.length;j++)res[i+j]^=gmul(g[j],c)}
  return res.slice(data.length)}
 /* 版本表：ver -> [總碼字, ecPerBlock, 區塊數]（EC-L，單一區塊組，涵蓋 v1..v10） */
 var VT={1:[26,7,1],2:[44,10,1],3:[70,15,1],4:[100,20,1],5:[134,26,1],6:[172,18,2],7:[196,20,2],8:[242,24,2],9:[292,30,2],10:[346,18,4]};
 function cap(v){var t=VT[v];return t[0]-t[1]*t[2]}
 function build(txt){
  var b=[],i;for(i=0;i<txt.length;i++){var c=txt.charCodeAt(i);
   if(c<128)b.push(c);else if(c<2048){b.push(192|c>>6,128|c&63)}else{b.push(224|c>>12,128|(c>>6&63),128|c&63)}}
  var ver=0;for(var v=1;v<=10;v++){var lenBits=(v<10)?8:16;if(4+lenBits+b.length*8<=cap(v)*8){ver=v;break}}
  if(!ver)return null;
  var t=VT[ver],total=t[0],ecl=t[1],blocks=t[2],dataLen=cap(ver);
  var bits=[];function put(val,n){for(var k=n-1;k>=0;k--)bits.push((val>>k)&1)}
  put(4,4);put(b.length,(ver<10)?8:16);for(i=0;i<b.length;i++)put(b[i],8);
  var rem=dataLen*8-bits.length;put(0,Math.min(4,rem));
  while(bits.length%8)bits.push(0);
  var pads=[236,17],pi=0;while(bits.length/8<dataLen){put(pads[pi++%2],8)}
  var dc=[];for(i=0;i<bits.length;i+=8){var byte=0;for(var k2=0;k2<8;k2++)byte=(byte<<1)|bits[i+k2];dc.push(byte)}
  var per=dataLen/blocks,db=[],eb=[];
  for(i=0;i<blocks;i++){var seg=dc.slice(i*per,(i+1)*per);db.push(seg);eb.push(rs(seg,ecl))}
  var out=[];for(i=0;i<per;i++)for(var j=0;j<blocks;j++)out.push(db[j][i]);
  for(i=0;i<ecl;i++)for(var j2=0;j2<blocks;j2++)out.push(eb[j2][i]);
  return {ver:ver,bytes:out}}
 function matrix(txt){
  var r=build(txt);if(!r)return null;
  var ver=r.ver,n=ver*4+17,m=[],res=[],i,j;
  for(i=0;i<n;i++){m.push(new Array(n).fill(null));res.push(new Array(n).fill(false))}
  function fp(x,y){for(i=-1;i<=7;i++)for(j=-1;j<=7;j++){var xx=x+i,yy=y+j;if(xx<0||yy<0||xx>=n||yy>=n)continue;
   var on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);
   m[yy][xx]=on?1:0;res[yy][xx]=true}}
  fp(0,0);fp(n-7,0);fp(0,n-7);
  for(i=8;i<n-8;i++){var v=(i%2===0)?1:0;if(m[6][i]===null){m[6][i]=v;res[6][i]=true}if(m[i][6]===null){m[i][6]=v;res[i][6]=true}}
  if(ver>=2){var pos=[6,n-7];for(var a=0;a<pos.length;a++)for(var b2=0;b2<pos.length;b2++){
   var cx=pos[a],cy=pos[b2];if((cx===6&&cy===6)||(cx===6&&cy===n-7)||(cx===n-7&&cy===6))continue;
   for(i=-2;i<=2;i++)for(j=-2;j<=2;j++){var on2=(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0));
    m[cy+j][cx+i]=on2?1:0;res[cy+j][cx+i]=true}}}
  for(i=0;i<9;i++){if(m[8][i]===null){m[8][i]=0;res[8][i]=true}if(m[i][8]===null){m[i][8]=0;res[i][8]=true}}
  for(i=0;i<8;i++){if(m[8][n-1-i]===null){m[8][n-1-i]=0;res[8][n-1-i]=true}if(m[n-1-i][8]===null){m[n-1-i][8]=0;res[n-1-i][8]=true}}
  m[n-8][8]=1;res[n-8][8]=true;

  while(col>0){if(col===6)col--;
   for(var rowi=0;rowi<n;rowi++){var y=up?(n-1-rowi):rowi;
    for(var c2=0;c2<2;c2++){var x=col-c2;if(res[y][x])continue;
     var dv=0;if(bi<bytes.length)dv=(bytes[bi]>>bit)&1;
     if((y+x)%2===0)dv^=1;
     m[y][x]=dv;bit--;if(bit<0){bit=7;bi++}}}

  var f=0x0<<0;var data=(1<<13);/* 直接用查表 */
  var FMT={0:0x77c4};var bitsF=0x77c4;
  for(i=0;i<15;i++){var v2=(bitsF>>i)&1;
   if(i<6)m[i][8]=v2;else if(i<8)m[i+1][8]=v2;else if(i===8)m[8][7]=v2;else m[8][14-i]=v2;
   if(i<8)m[8][n-1-i]=v2;else m[n-15+i][8]=v2}
  for(i=0;i<n;i++)for(j=0;j<n;j++)if(m[i][j]===null)m[i][j]=0;
  return m}
 return {svg:function(txt,px){var m=matrix(txt);if(!m)return '';
  var n=m.length,q=4,S=n+q*2,sc=(px||280)/S,d='';
  for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(m[y][x])d+='M'+(x+q)+' '+(y+q)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 '+S+' '+S+'" shape-rendering="crispEdges">'+
   '<rect width="'+S+'" height="'+S+'" fill="#EDE8DF"/><path d="'+d+'" fill="#131A22"/></svg>'}}
})();

  var c=document.createElement('canvas'),w=240,h=Math.round(im.height*w/im.width);
  c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);

 fr.readAsDataURL(file)}

 document.getElementById('scx').onclick=function(){f.innerHTML=''};

  save();renderShop();toast(i!==null?'已儲存':'已加入');if(ST.room)roomSync(true)}}

/* ---- 匯率（JPY → TWD，免金鑰） ---- */
function rateVal(){return ST.rate&&ST.rate.v?ST.rate.v:0}
function fmtNT(n){return 'NT$'+Math.round(n).toLocaleString()}
function fmtJP(n){return '¥'+Math.round(n).toLocaleString()}
function toJPY(e){var r=e.rate||rateVal();
 if(e.cur==='TWD')return r?e.amt/r:e.amt*5;return e.amt}
function rateAge(){if(!ST.rate.at)return '';
 var h=Math.floor((Date.now()-ST.rate.at)/3600000);
 if(h<1)return '剛剛更新';if(h<24)return h+' 小時前';return Math.floor(h/24)+' 天前'}
function fetchRate(cb){
 if(ST.rate.manual)return cb&&cb(null);
 fetch('https://open.er-api.com/v6/latest/JPY').then(function(r){return r.json()})
 .then(function(o){
  if(o&&o.rates&&o.rates.TWD){ST.rate={v:o.rates.TWD,at:Date.now(),manual:false};save();
   if(cur==='split')renderSplit();cb&&cb(null)}
  else cb&&cb('bad')})
 .catch(function(){cb&&cb('offline')})}

/* ---- 即時同步房間（Firebase Realtime Database） ---- */
/* 在下面填入你的 Firebase databaseURL，例如：
   var FB_DB="https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app";
   沒填就自動隱藏即時同步，只用離線同步碼。 */
var FB_DB="https://kansai-a631b-default-rtdb.asia-southeast1.firebasedatabase.app";

var SYNCING=false,LASTPULL=0,FBPOLL=null;
function fbReady(){return !!FB_DB && !!ST.room}
function fbURL(){return FB_DB.replace(/\/$/,'')+'/rooms/'+ST.room+'.json'}
function roomPayload(){return {v:1,members:ST.members,exp:ST.exp,at:Date.now()}}
function mergeRoom(o){
 if(!o)return 0;
 var have={};ST.exp.forEach(function(x){if(x.id)have[x.id]=1});
 var n=0,list=o.exp||[];
 if(!Array.isArray(list))list=Object.keys(list).map(function(k){return list[k]});
 list.forEach(function(x){if(x&&x.id&&!have[x.id]){ST.exp.push(x);n++}});
 if(o.members)for(var i=0;i<5;i++){if(!ST.members[i]&&o.members[i])ST.members[i]=o.members[i]}
 if(o.shops){ST.shopAll=o.shops;
  /* 若雲端有自己的清單而本機是空的（換裝置），拉回來 */
  if(ST.me!==null&&(!ST.shop||!ST.shop.length)&&o.shops[ST.me]&&o.shops[ST.me].length)ST.shop=o.shops[ST.me]}
 save();return n}
function roomCreate(cb){
 if(!FB_DB)return cb('no-config');
 var id=Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,6);
 ST.room=id;
 fetch(fbURL(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(roomPayload())})
 .then(function(r){if(!r.ok)throw 0;save();cb(null,id)})
 .catch(function(){ST.room='';cb('write-fail')})}
function roomPush(cb){
 if(!fbReady())return cb&&cb('no-room');
 /* PATCH 只覆蓋自己負責的欄位，不會清掉別人的購物清單 */
 fetch(fbURL(),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(roomPayload())})
 .then(function(r){
   if(ST.me===null)return r;
   return fetch(FB_DB.replace(/\/$/,'')+'/rooms/'+ST.room+'/shops/'+ST.me+'.json',
    {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(ST.shop||[])}).then(function(){return r})})
 .then(function(r){cb&&cb(r&&r.ok?null:'push-fail')}).catch(function(){cb&&cb('offline')})}
function roomPull(cb){
 if(!fbReady())return cb&&cb('no-room',0);
 fetch(fbURL()).then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(o){var n=mergeRoom(o);LASTPULL=Date.now();cb&&cb(null,n)})
 .catch(function(){cb&&cb('offline',0)})}
function roomSync(silent){
 if(!fbReady()||SYNCING)return;SYNCING=true;
 roomPull(function(e,n){
  if(e){SYNCING=false;if(!silent)toast('同步失敗 ・ 檢查網路');return}
  roomPush(function(){SYNCING=false;
   if(cur==='split')renderSplit();else if(cur==='shop')renderShop();
   if(!silent)toast(n?('已同步 ・ 收到 '+n+' 筆新紀錄'):'已同步 ・ 沒有新紀錄')})})}
FBPOLL=setInterval(function(){if(fbReady()&&(cur==='split'||cur==='shop'))roomSync(true)},10000);

/* ---- 分帳同步碼 ---- */
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/=+$/,'')}
function b64d(str){try{return decodeURIComponent(escape(atob(str)))}catch(e){return null}}
function ledgerCode(){
 var m=ST.members.map(function(x){return (x||'').replace(/[|;,]/g,'')}).join(',');
 var e=ST.exp.map(function(x){return [x.id||'',x.amt,x.by,x.who.join('.'),(x.note||'').replace(/[|;,]/g,' ')].join(',')}).join(';');
 return 'K5'+b64e(m+'|'+e)}
function ledgerImport(code){
 code=(code||'').trim();
 if(code.indexOf('K5')!==0)return {ok:false,msg:'這不是分帳同步碼'};
 var raw=b64d(code.slice(2));if(raw===null)return {ok:false,msg:'同步碼壞了或不完整'};
 var parts=raw.split('|'),mm=parts[0].split(','),ee=(parts[1]||'').split(';');
 var have={};ST.exp.forEach(function(x){if(x.id)have[x.id]=1});
 var added=0;
 ee.forEach(function(row){if(!row)return;var f=row.split(',');
  if(f.length<4)return;var id=f[0];if(!id||have[id])return;
  ST.exp.push({id:id,amt:parseInt(f[1],10)||0,by:parseInt(f[2],10)||0,
   who:(f[3]||'').split('.').filter(function(x){return x!==''}).map(Number),note:f.slice(4).join(',')||''});
  added++});
 for(var i=0;i<5;i++){if(!ST.members[i]&&mm[i])ST.members[i]=mm[i]}
 save();return {ok:true,msg:'已合併 '+added+' 筆（重複的自動略過）'}}
