<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131A22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>關西五日</title>
<style>
:root{--ground:#131A22;--surface:#1B242F;--surface2:#222D3A;--paper:#EDE8DF;--dim:#8A97A6;
--amber:#E8A33D;--red:#E4574A;--moss:#63A46C;--line:#2C3A49;--cyan:#5BA8C4;--violet:#9B8BC4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(91,168,196,.07),transparent 60%),
                   radial-gradient(100% 40% at 50% 108%,rgba(0,0,0,.35),transparent 55%);
  background-attachment:fixed;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC","Segoe UI",sans-serif;font-size:16px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:rgba(19,26,34,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 9px) 0 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 7px}
.brand b{font-size:14px;font-weight:700;letter-spacing:.02em;color:#B9C4D0}
.brand .qbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;
  width:30px;height:30px;font-size:14px;cursor:pointer;padding:0;flex:0 0 auto}
.brand .qbtn.on{border-color:var(--cyan);color:var(--cyan)}
.clock{display:flex;align-items:center;gap:7px}
.clock .jst{font-size:22px;font-weight:700;color:var(--amber);letter-spacing:-.04em}
.clock .zn{font-size:9.5px;color:var(--dim);line-height:1.15;text-align:right;letter-spacing:.04em}
nav{display:flex;gap:5px;overflow-x:auto;padding:0 16px 7px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:5px 11px;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:1.35}
nav button .d{font-size:10px;display:inline;opacity:.6;margin-left:5px;letter-spacing:-.02em}
nav button{display:inline-flex;align-items:center;gap:4px}
nav button[aria-selected="true"]{background:var(--paper);color:var(--ground);border-color:var(--paper);font-weight:650}
nav button[aria-selected="true"] svg{color:var(--ground)!important}
/* 日期分頁選中時吃當天主題色 */
nav button.dayt[aria-selected="true"]{background:var(--dayc);border-color:var(--dayc);color:#101720}
nav button.dayt[aria-selected="true"] svg{color:#101720!important}
nav button.dayt[aria-selected="true"] .d{color:#101720;opacity:.72}
nav button.today{border-color:var(--dayc,var(--cyan));color:var(--dayc,var(--cyan))}
/* 標題列底線也跟著當天顏色 */
header{border-bottom-color:var(--dayc,var(--line))!important;transition:border-color .25s}
nav button.sep{margin-left:10px;position:relative}
nav button.sep::before{content:"";position:absolute;left:-6px;top:20%;bottom:20%;width:1px;background:var(--line)}
nav button .dot{position:absolute;top:3px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--moss)}
nav button.today{border-color:var(--cyan);color:var(--cyan)}
#live{padding:11px 16px;border-bottom:1px solid rgba(91,168,196,.4);background:linear-gradient(180deg,rgba(91,168,196,.18),rgba(91,168,196,.06))}
#live.late{border-bottom-color:rgba(228,87,74,.5);background:linear-gradient(180deg,rgba(228,87,74,.2),rgba(228,87,74,.06))}
#live.early{border-bottom-color:rgba(99,164,108,.5);background:linear-gradient(180deg,rgba(99,164,108,.18),rgba(99,164,108,.05))}
#live.early .l1{color:#8FCB97}
#live .l1{font-size:11.5px;color:var(--cyan);font-weight:700;letter-spacing:.06em;display:flex;justify-content:space-between}
#live.late .l1{color:var(--red)}
#live .l2{font-size:21px;font-weight:700;margin:3px 0 3px;line-height:1.3}
#live .l3{font-size:12.5px;color:#B5C2CE}
#live .l3 b{color:var(--amber)}
#live .pb{height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:7px 0 5px;overflow:hidden}
#live .pb i{display:block;height:100%;background:var(--cyan);border-radius:2px}
#live.late .pb i{background:var(--red)}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);object-fit:cover;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.avwrap{position:relative;display:inline-block;vertical-align:middle;line-height:0;flex:0 0 auto}
.avwrap input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2}
.av{position:relative;z-index:1}
main{padding:0 15px 70px;max-width:640px;margin:0 auto}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
main.anim{animation:fadein .22s ease-out}
@media (prefers-reduced-motion:reduce){main.anim{animation:none}}
.warnbar{background:rgba(228,87,74,.12);border:1px solid rgba(228,87,74,.4);border-radius:5px;
  padding:9px 12px;margin:0 0 11px;font-size:12.5px;color:#F5A79E;line-height:1.55}
.warnbar b{color:#FFB4AB}
.slot.conf .rail::after{background:var(--red);border-color:var(--red)}
.slot.conf .tm{color:var(--red)}
.card.conf{border-color:rgba(228,87,74,.6)}
.hero{margin:11px 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.hero .dayband{display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--dayc) 16%,transparent),transparent 70%);
  border-bottom:1px solid var(--line)}
.hero .dayband .di{display:flex;align-items:center}
.hero .dayband .dt{font-size:13px;font-weight:800;color:var(--dayc);letter-spacing:.04em}
.hero .dayband .dd{font-size:11.5px;color:var(--dim)}
.hero .dayband .dn{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.hero .top{display:flex;align-items:center;gap:9px;padding:8px 12px;background:rgba(228,87,74,.1);
  border-bottom:1px solid rgba(228,87,74,.28)}
.hero .top .lab{color:var(--red);font-size:9.5px;font-weight:800;letter-spacing:.12em;flex:0 0 auto}
.hero .top .t{font-size:18px;font-weight:750;color:var(--red);flex:0 0 auto;letter-spacing:-.03em}
.hero .top .w{font-size:12.5px;flex:1 1 auto;min-width:80px;color:#E8D5D2;line-height:1.3}
.hero .top .exp{background:none;border:0;color:var(--red);font-size:12px;cursor:pointer;padding:2px 4px;flex:0 0 auto}
.hero .why{display:none;padding:8px 12px;font-size:12px;color:var(--dim);line-height:1.55;border-bottom:1px solid var(--line)}
.hero.open .why{display:block}
.hero .bot{display:flex;align-items:center;gap:12px;padding:7px 12px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.hero .bot b{color:var(--paper);font-weight:650}
.hero .bot .tot b{color:var(--amber);font-size:14px}
.bar{display:flex;gap:6px;margin:0 0 11px;align-items:stretch}
.bar button,.bar a{flex:1 1 auto;background:var(--surface);border:1px solid var(--line);color:var(--paper);border-radius:5px;
  padding:9px 8px;font-size:12.5px;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none;
  transition:background .12s,border-color .12s}
.bar button:active,.bar a:active{background:var(--surface2);transform:translateY(1px)}
.bar button.pri{background:var(--cyan);color:var(--ground);border-color:var(--cyan);font-weight:700}
.bar button.more{flex:0 0 46px;font-size:16px;letter-spacing:.08em}
.morebox{display:none;grid-template-columns:1fr 1fr;gap:7px;margin:-6px 0 14px}
.morebox.on{display:grid}
.morebox button,.morebox a{background:var(--surface);border:1px solid var(--line);color:#C9D2DC;border-radius:5px;
  padding:10px;font-size:12.5px;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none}
.morebox button:active,.morebox a:active{background:var(--surface2)}
.slot{display:grid;grid-template-columns:54px 1fr;gap:13px;position:relative}
.slot .rail{position:relative;padding-right:2px}
.slot .rail::before{content:"";position:absolute;left:calc(100% + 7px);top:14px;bottom:-6px;width:1px;background:var(--line)}
.slot:last-child .rail::before{display:none}
.slot .rail::after{content:"";position:absolute;left:calc(100% + 3px);top:9px;width:9px;height:9px;border-radius:50%;background:var(--ground);border:1.5px solid var(--line);box-sizing:border-box;z-index:1}
.slot.done .rail::after{background:var(--moss);border-color:var(--moss)}
.slot.dl .rail::after{border-color:var(--red);border-width:2px}
.slot.now .rail::after{background:var(--dayc,var(--cyan));border-color:var(--dayc,var(--cyan));box-shadow:0 0 0 4px color-mix(in srgb,var(--dayc,#5BA8C4) 26%,transparent)}
.slot .tm{font-size:15.5px;font-weight:650;color:var(--dayc,var(--amber));letter-spacing:-.03em}
.slot.dl .tm{color:var(--red)}
.slot .te{font-size:11px;color:var(--dim);letter-spacing:-.02em}
.slot .eta{font-size:11px;color:var(--red);font-weight:700;margin-top:3px;letter-spacing:-.02em}
.slot .eta.early{color:var(--moss)}
.slot.past{opacity:.38}
.slot.past .tm{text-decoration:line-through;text-decoration-thickness:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin-bottom:9px;
  transition:border-color .15s,background .15s}
.card:active{background:var(--surface2)}
.card.dead{border-color:rgba(228,87,74,.5);background:linear-gradient(90deg,rgba(228,87,74,.11),rgba(228,87,74,0) 55%),var(--surface2)}
.card.eat{border-left:2px solid rgba(99,164,108,.65)}
.card.move{background:rgba(27,36,47,.55);border-color:rgba(44,58,73,.7);padding:9px 14px}
.card.move .hd h3{font-size:14px;font-weight:550;color:#B9C4D0}
.card.adhoc{border-style:dashed;border-color:var(--cyan)}
.card.now{border-color:var(--dayc,var(--cyan));box-shadow:0 0 0 1px var(--dayc,var(--cyan)),0 4px 20px color-mix(in srgb,var(--dayc,#5BA8C4) 18%,transparent)}
.card.ok{opacity:.5}
.card.ok .hd h3{text-decoration:line-through;text-decoration-color:var(--dim)}
.dltag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--red);
  background:rgba(228,87,74,.14);border:1px solid rgba(228,87,74,.35);border-radius:3px;padding:1px 6px;margin-bottom:6px}
.nowtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ground);background:var(--cyan);border-radius:3px;padding:1px 6px;margin-bottom:5px}
.hd{display:flex;align-items:flex-start;gap:8px}
.hd h3{margin:0;font-size:15.5px;font-weight:620;flex:1;line-height:1.42;cursor:pointer;letter-spacing:-.01em}
.chev{color:var(--dim);font-size:12px;margin-top:3px}
.card.open .chev{transform:rotate(90deg)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:3px;background:#2A3746;color:var(--dim)}
.tag.r{background:rgba(228,87,74,.2);color:#F09A90}
.tag.a{background:rgba(232,163,61,.18);color:var(--amber)}
.tag.g{background:rgba(99,164,108,.18);color:#8FCB97}
.tag.v{background:rgba(155,139,196,.2);color:#C4B8E0}
.tag.c{background:rgba(91,168,196,.2);color:var(--cyan)}
.lk{font-size:11.5px;padding:3px 9px;border-radius:3px;text-decoration:none;border:1px solid;display:inline-block;font-family:inherit;cursor:pointer}
.lk.map{background:rgba(91,168,196,.16);color:var(--cyan);border-color:rgba(91,168,196,.35)}
.lk.nav{background:var(--moss);color:#0E1712;border-color:var(--moss);font-weight:750}
.lk.spk{background:rgba(91,168,196,.14);color:var(--cyan);border-color:rgba(91,168,196,.35);padding:3px 10px;font-size:13px}
.lk.mo{background:transparent;border-color:var(--line);color:var(--dim);font-weight:700;letter-spacing:.1em;padding:3px 11px}
.tags.more2{display:none;margin-top:6px;padding-top:7px;border-top:1px dashed var(--line)}
.tags.more2.on{display:flex}
.lk.dir{background:rgba(155,139,196,.16);color:#C4B8E0;border-color:rgba(155,139,196,.4)}
.lk.food{background:rgba(99,164,108,.14);color:#8FCB97;border-color:rgba(99,164,108,.35)}
.lk.web{background:rgba(232,163,61,.13);color:var(--amber);border-color:rgba(232,163,61,.3)}
.lk.ed{background:#2A3746;color:var(--paper);border-color:var(--line)}
.lk.rm{background:rgba(228,87,74,.14);color:#F09A90;border-color:rgba(228,87,74,.3)}
.lk.rm.armed{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.lk.go{background:var(--moss);color:#0E1712;border-color:var(--moss);font-weight:700}
.lk.gone{background:rgba(99,164,108,.16);color:#8FCB97;border-color:rgba(99,164,108,.4)}
.tonight{background:linear-gradient(180deg,rgba(155,139,196,.13),rgba(155,139,196,.05));border:1px solid rgba(155,139,196,.4);border-radius:4px;padding:13px;margin:16px 0 8px}
.tonight .t1{font-size:12.5px;font-weight:700;color:#C4B8E0;letter-spacing:.04em;margin-bottom:6px}
.tonight ul{margin:0;padding-left:18px;font-size:13.5px;color:#C9D2DC}
.tonight li{margin:4px 0}
.tonight b{color:var(--paper)}
.tonight .t2{margin-top:9px;padding-top:9px;border-top:1px solid rgba(155,139,196,.3);font-size:13px;color:var(--amber);font-weight:600}
.pic{margin-top:8px;background:rgba(232,163,61,.08);border:1px solid rgba(232,163,61,.25);border-radius:5px;
  font-size:13px;color:#E4D3B4;line-height:1.6;overflow:hidden}
.pic .pich{display:flex;align-items:center;gap:6px;padding:7px 11px;cursor:pointer;user-select:none;font-size:12px}
.pic .pich b{color:var(--amber);font-weight:700;letter-spacing:.03em}
.pic .pia{margin-left:auto;color:var(--amber);font-size:10px;transition:transform .15s}
.pic.open .pia{transform:rotate(180deg)}
.pic .picb{display:none;padding:0 11px 10px;border-top:1px solid rgba(232,163,61,.18);margin-top:0;padding-top:9px}
.pic.open .picb{display:block}
.pic:active{background:rgba(232,163,61,.13)}
.pic b{color:var(--amber)}
.body{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:14px;color:#C9D2DC}
.card.open .body{display:block}
.body ul{margin:0;padding-left:0;list-style:none}
.body li{margin:0 0 7px;padding-left:14px;position:relative}
.body li:last-child{margin-bottom:0}
.body li::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--line)}
.body b{color:var(--paper)}
.body .warn{color:#F5A79E;background:rgba(228,87,74,.09);border-left:2px solid rgba(228,87,74,.5);
  padding:6px 10px 6px 12px;border-radius:0 4px 4px 0;margin-left:-14px}
.body .warn::before{display:none}
.form{background:var(--surface2);border:1px dashed var(--cyan);border-radius:4px;padding:13px;margin:0 0 14px}
.form h4{margin:0 0 9px;font-size:13.5px;color:var(--cyan);font-weight:650}
.form .row{display:flex;gap:7px;margin-bottom:7px}
.form select{appearance:none;-webkit-appearance:none;background-image:none}
.form input,.form select{background:var(--ground);border:1px solid var(--line);color:var(--paper);border-radius:3px;padding:9px 10px;font-size:14px;font-family:inherit;width:100%}
.trow{display:flex;align-items:center;gap:4px;margin-bottom:9px}
.form input.t{flex:1 1 0;text-align:center;min-width:0;font-size:16px;letter-spacing:.02em}
.tadj{flex:0 0 34px;background:var(--surface2);border:1px solid var(--line);color:var(--cyan);
  border-radius:4px;padding:9px 0;font-size:12px;font-family:inherit;cursor:pointer;min-height:40px}
.tadj:active{background:var(--cyan);color:var(--ground)}
.tdash{flex:0 0 auto;color:var(--dim);font-size:13px;padding:0 2px}
.form input::placeholder{color:#5C6B7C}
.form .btns{display:flex;gap:7px}
.form .go{flex:1;background:var(--cyan);border:0;color:var(--ground);font-weight:650;border-radius:3px;padding:10px;font-size:14px;font-family:inherit;cursor:pointer}
.form .cx{flex:0 0 84px;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:3px;padding:10px;font-size:14px;font-family:inherit;cursor:pointer}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.who label{font-size:13px;padding:6px 11px;border-radius:999px;background:var(--ground);border:1px solid var(--line);cursor:pointer;color:var(--dim)}
.who input{display:none}
.who input:checked+span{color:var(--cyan);font-weight:600}
.who label:has(input:checked){border-color:var(--cyan);background:rgba(91,168,196,.12)}
h2.sec{font-size:11.5px;font-weight:800;color:var(--dayc,var(--amber));margin:26px 0 11px;letter-spacing:.13em;
  padding-bottom:7px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;gap:8px;user-select:none}
h2.sec:first-child{margin-top:14px}
h2.sec .ar{font-size:10px;color:var(--dim);transition:transform .15s;flex:0 0 auto}
h2.sec.fold .ar{transform:rotate(-90deg)}
.secbody{overflow:hidden}
.secbody.fold{display:none}
.packrow{display:flex;align-items:stretch;gap:5px;margin-bottom:7px}
.packrow .chk{flex:1 1 auto;margin-bottom:0}
.pkx,.pke{flex:0 0 32px;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;padding:0}
.pkx:active,.pke:active{background:var(--surface2)}
.pke{color:var(--cyan)}
.pkx{color:#F09A90}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:7px;cursor:pointer}
.chk input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--moss);flex:0 0 auto}
.chk .x{flex:1;font-size:14px}
.chk .x small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.chk.done .x{opacity:.42;text-decoration:line-through}
.tel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:7px;color:var(--paper);text-decoration:none}
.tel .n{font-size:14.5px}.tel .n small{display:block;color:var(--dim);font-size:12px}
.tel .num{font-size:14px;color:var(--amber);white-space:nowrap}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:4px;padding:12px;font-size:13.5px;color:#C9D2DC;margin-bottom:10px}
.note b{color:var(--paper)}
.hotel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px;margin-bottom:10px}
.hotel h4{margin:0 0 3px;font-size:15px}
.hotel .sub{font-size:12.5px;color:var(--dim);margin-bottom:9px}
.store{font-size:11.5px;padding:6px 10px;border-radius:4px;margin-bottom:12px;text-align:center}
.store.on{background:rgba(99,164,108,.14);color:#8FCB97;border:1px solid rgba(99,164,108,.3)}
.store.off{background:rgba(228,87,74,.12);color:#F09A90;border:1px solid rgba(228,87,74,.3)}
.exp{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:7px}
.exp .l{flex:1;font-size:14px}
.exp .l small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.exp .r{text-align:right;white-space:nowrap}
.exp .r b{font-size:15px;color:var(--amber)}
.expbtn{display:flex;gap:10px;margin-top:8px;justify-content:flex-end}

/* ---- 最簡轉帳：把應收應付化成最少筆的實際轉帳 ---- */
function settle(bal){
 var pos=[],neg=[],i;
 for(i=0;i<5;i++){
  var v=Math.round(bal[i]);
  if(v>0)pos.push({i:i,v:v});
  else if(v<0)neg.push({i:i,v:-v})}
 pos.sort(function(a,b){return b.v-a.v});
 neg.sort(function(a,b){return b.v-a.v});
 var out=[],p=0,n=0,guard=0;
 while(p<pos.length&&n<neg.length&&guard++<40){
  var amt=Math.min(pos[p].v,neg[n].v);
  if(amt>0)out.push({from:neg[n].i,to:pos[p].i,amt:amt});
  pos[p].v-=amt;neg[n].v-=amt;
  if(pos[p].v<=0)p++;
  if(neg[n].v<=0)n++}
 return out}

/* ---- 每日費用試算（從標籤解析 ¥ 金額） ---- */
function yenOf(tags){
 var sum=0;
 (tags||[]).forEach(function(t){
  if(/Pass|周遊券/i.test(t))return;              /* 已含在票券裡，不重複計 */
  var m=String(t).match(/¥\s?([\d,]+)/);
  if(m)sum+=parseInt(m[1].replace(/,/g,''),10)||0});
 return sum}
function dayCost(k){
 var move=0,other=0,note=[];
 slotsOf(k).forEach(function(x){
  var v=yenOf(x.g);
  if(!v)return;
  if(x.k==='move')move+=v; else other+=v;
  note.push({t:stripTag(x.t),v:v,m:x.k==='move'})});
 return {move:move,other:other,total:move+other,items:note}}

var SPK={cur:null},VOICES=[],VREADY=false;
function speakSupported(){return 'speechSynthesis' in window}
function stripTag(h){return String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim()}
/* 去掉 emoji 與符號，避免被逐字唸出來 */
function stripEmoji(t){
 return String(t).replace(/[\u2190-\u21FF\u2300-\u27BF\u2B00-\u2BFF\uFE0F\u200D]/g,'')
   .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,'').replace(/\s+/g,' ').trim()}

/* 語音清單是非同步載入的，一定要等它就緒 */
function loadVoices(cb,tries){
 tries=tries||0;
 var v=[];
 try{v=speechSynthesis.getVoices()||[]}catch(e){}
 if(v.length){VOICES=v;VREADY=true;return cb&&cb()}
 if(tries>=6){VOICES=[];VREADY=true;return cb&&cb()}   /* 最多等約 1.8 秒 */
 try{speechSynthesis.onvoiceschanged=function(){
  var v2=speechSynthesis.getVoices()||[];
  if(v2.length){VOICES=v2;VREADY=true;speechSynthesis.onvoiceschanged=null;cb&&cb()}}}catch(e){}
 setTimeout(function(){loadVoices(cb,tries+1)},300)}
function pickVoice(){
 if(ST.voice){
  var pinned=VOICES.filter(function(x){return x.name===ST.voice})[0];
  if(pinned)return pinned}
 var pri=[
  function(x){return /^zh[-_]TW$/i.test(x.lang)},
  function(x){return /^(cmn|zh)[-_]?(Hant|TW|HK|MO)/i.test(x.lang)},
  function(x){return /(Ting-?Ting|Mei-?Jia|Sin-?Ji|國語|台灣|臺灣|中文|Chinese \(Taiwan\)|Chinese \(Traditional\))/i.test(x.name)},
  function(x){return /^zh/i.test(x.lang)},
  function(x){return /(Chinese|Mandarin|普通话|普通話)/i.test(x.name)}];
 for(var i=0;i<pri.length;i++){var m=VOICES.filter(pri[i])[0];if(m)return m}
 return null}

function speak(txt,id){
 if(!speakSupported())return toast('這個瀏覽器不支援語音朗讀');
 if(SPK.cur===id&&speechSynthesis.speaking){speechSynthesis.cancel();SPK.cur=null;syncSpkBtns();return}
 speechSynthesis.cancel();
 loadVoices(function(){
  var v=pickVoice();
  if(!v){
   /* 挑不到中文也照唸 —— 指定 lang 讓系統自己選，總比完全不出聲好 */
   var names=VOICES.slice(0,3).map(function(x){return x.name+'('+x.lang+')'}).join('、');
   toast('沒有偵測到中文語音，改用系統預設<br><span style="font-weight:400">偵測到 '+VOICES.length+' 種：'+(names||'無')+'<br>到「準備」分頁可手動指定</span>');}
  var clean=stripEmoji(txt);
  /* 長句切段，避免部分瀏覽器攔腰截斷 */
  var chunks=clean.split(/(?<=[。！？；\n])/).filter(function(x){return x.trim()});
  if(!chunks.length)chunks=[clean];
  var merged=[],buf='';
  chunks.forEach(function(c){
   if((buf+c).length>140){if(buf)merged.push(buf);buf=c} else buf+=c});
  if(buf)merged.push(buf);
  SPK.cur=id;
  merged.forEach(function(c,i){
   var u=new SpeechSynthesisUtterance(c);
   if(v)u.voice=v;
   u.lang=(v&&v.lang)||'zh-TW';u.rate=0.95;u.pitch=1;u.volume=1;
   if(i===merged.length-1)u.onend=function(){SPK.cur=null;syncSpkBtns()};
   u.onerror=function(){SPK.cur=null};
   speechSynthesis.speak(u)});
  syncSpkBtns()})}

/* 只更新朗讀按鈕的外觀，不重繪整頁（重繪會把 ⋯ 選單關掉、捲動也會受影響） */
function syncSpkBtns(){
 if(!main||!main.querySelectorAll)return;
 [].forEach.call(main.querySelectorAll('[data-spk]'),function(b){
  var on=(SPK.cur===cur+b.dataset.spk);
  b.textContent=on?'⏹':'🔊';
  if(b.classList){if(on)b.classList.add('gone');else b.classList.remove('gone')}})}
function slotSpeech(x){
 var t=stripEmoji(stripTag(x.t));
 var parts=[x.a+' 到 '+x.b+'，'+t];
 if(x.g&&x.g.length)parts.push('重點：'+x.g.join('、'));
 if(x.pic)parts.push('拍照重點：'+stripEmoji(stripTag(x.pic)));
 if(x.x)parts.push(stripEmoji(stripTag(x.x)));
 return parts.join('。')}

 fr.onerror=function(){toast('照片讀取失敗，換一張試試')};

 ensureDays();save();return {ok:true,msg:'已還原'}}

function buildIndex(){
 var idx=[];
 ['d0','d1','d2','d3','d4','d5'].forEach(function(k){
  slotsOf(k).forEach(function(x){
   idx.push({p:D[k].label,t:x.a+' '+x.t,d:(x.x||'').replace(/<[^>]+>/g,' ')+' '+(x.q||'')+' '+((x.g||[]).join(' ')),k:k})})});
 GUIDE_SHOP.forEach(function(x){idx.push({p:'購物',t:x.n,d:(x.s||'')+' '+(x.note||''),k:'shop'})});
 BOOK.forEach(function(x){idx.push({p:'準備',t:x[1],d:x[0]+' '+x[2],k:'prep'})});
 TEL.forEach(function(x){idx.push({p:'準備',t:x[0]+' '+x[2],d:x[1],k:'prep'})});
 CHECK.forEach(function(x){idx.push({p:'準備',t:x[0],d:x[1],k:'prep'})});
 PACK.forEach(function(sec){sec[1].forEach(function(it){idx.push({p:'行李',t:it[0],d:it[1]||'',k:'pack'})})});
 return idx}
function doSearch(q){
 q=(q||'').trim().toLowerCase();if(q.length<1)return [];
 return buildIndex().filter(function(x){
  return (x.t+' '+x.d).toLowerCase().indexOf(q)>=0}).slice(0,40)}

/* ---- 匯率（JPY → TWD，免金鑰） ---- */
function rateVal(){return ST.rate&&ST.rate.v?ST.rate.v:0}
function fmtNT(n){return 'NT$'+Math.round(n).toLocaleString()}
function fmtJP(n){return '¥'+Math.round(n).toLocaleString()}
function toJPY(e){var r=e.rate||rateVal();
 if(e.cur==='TWD')return r?e.amt/r:e.amt*5;return e.amt}
function rateAge(){if(!ST.rate.at)return '';
 var h=Math.floor((Date.now()-ST.rate.at)/3600000);
 if(h<1)return '剛剛更新';if(h<24)return h+' 小時前';return Math.floor(h/24)+' 天前'}
function fetchRate(cb){
 if(ST.rate.manual)return cb&&cb(null);
 fetch('https://open.er-api.com/v6/latest/JPY').then(function(r){return r.json()})
 .then(function(o){
  if(o&&o.rates&&o.rates.TWD){ST.rate={v:o.rates.TWD,at:Date.now(),manual:false};save();
   if(cur==='split'&&!formOpen())keepScroll(renderSplit);cb&&cb(null)}
  else cb&&cb('bad')})
 .catch(function(){cb&&cb('offline')})}

/* ---- 即時同步房間（Firebase Realtime Database） ---- */
/* 在下面填入你的 Firebase databaseURL，例如：
   var FB_DB="https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app";
   沒填就自動隱藏即時同步，只用離線同步碼。 */
var FB_DB="https://kansai-a631b-default-rtdb.asia-southeast1.firebasedatabase.app";

var SYNCING=false,LASTPULL=0,FBPOLL=null;
function fbReady(){return !!FB_DB && !!ST.room}
function fbURL(){return FB_DB.replace(/\/$/,'')+'/rooms/'+ST.room+'.json'}
function roomPayload(){return {v:1,members:ST.members,exp:ST.exp,expDel:ST.expDel,at:Date.now()}}
function mergeRoom(o){
 if(!o)return 0;
 /* 合併別人的刪除紀錄 */
 var od=o.expDel||[];
 if(!Array.isArray(od))od=Object.keys(od).map(function(k){return od[k]});
 od.forEach(function(id){if(id&&ST.expDel.indexOf(id)<0)ST.expDel.push(id)});
 /* 把已被刪除的紀錄從本機移除 */
 if(ST.expDel.length)ST.exp=ST.exp.filter(function(x){return ST.expDel.indexOf(x.id)<0});
 var have={};ST.exp.forEach(function(x){if(x.id)have[x.id]=1});
 var n=0,list=o.exp||[];
 if(!Array.isArray(list))list=Object.keys(list).map(function(k){return list[k]});
 /* 只加入沒看過、且沒被刪掉的 */
 list.forEach(function(x){if(x&&x.id&&!have[x.id]&&ST.expDel.indexOf(x.id)<0){ST.exp.push(x);n++}});
 if(o.members)for(var i=0;i<5;i++){if(!ST.members[i]&&o.members[i])ST.members[i]=o.members[i]}
 if(o.shops){ST.shopAll=o.shops;
  /* 只有「這台裝置從未動過購物清單」才從雲端拉回（換手機的情境）。
     已經動過就代表刪空是使用者的意思，不可以復活 */
  if(ST.me!==null&&!ST.shopInit&&(!ST.shop||!ST.shop.length)&&o.shops[ST.me]&&o.shops[ST.me].length){
   ST.shop=o.shops[ST.me];ST.shopInit=true}}
 save();return n}
function roomCreate(cb){
 if(!FB_DB)return cb('no-config');
 var id=Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,6);
 ST.room=id;
 fetch(fbURL(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(roomPayload())})
 .then(function(r){if(!r.ok)throw 0;save();cb(null,id)})
 .catch(function(){ST.room='';cb('write-fail')})}
function roomPush(cb){
 if(!fbReady())return cb&&cb('no-room');
 /* PATCH 只覆蓋自己負責的欄位，不會清掉別人的購物清單 */
 fetch(fbURL(),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(roomPayload())})
 .then(function(r){
   if(ST.me===null)return r;
   return fetch(FB_DB.replace(/\/$/,'')+'/rooms/'+ST.room+'/shops/'+ST.me+'.json',
    {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(ST.shop||[])}).then(function(){return r})})
 .then(function(r){cb&&cb(r&&r.ok?null:'push-fail')}).catch(function(){cb&&cb('offline')})}
function roomPull(cb){
 if(!fbReady())return cb&&cb('no-room',0);
 fetch(fbURL()).then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(o){var n=mergeRoom(o);LASTPULL=Date.now();cb&&cb(null,n)})
 .catch(function(){cb&&cb('offline',0)})}
function roomSync(silent){
 if(!fbReady()||SYNCING)return;SYNCING=true;
 roomPull(function(e,n){
  if(e){SYNCING=false;if(!silent)toast('同步失敗 ・ 檢查網路');return}
  roomPush(function(){SYNCING=false;
   if(!formOpen()){if(cur==='split')keepScroll(renderSplit);else if(cur==='shop')keepScroll(renderShop)}
   if(!silent)toast(n?('已同步 ・ 收到 '+n+' 筆新紀錄'):'已同步 ・ 沒有新紀錄')})})}
FBPOLL=setInterval(function(){if(fbReady()&&(cur==='split'||cur==='shop')&&!formOpen())roomSync(true)},10000);

/* ---- 分帳同步碼 ---- */
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/=+$/,'')}
function b64d(str){try{return decodeURIComponent(escape(atob(str)))}catch(e){return null}}
function ledgerCode(){
 var m=ST.members.map(function(x){return (x||'').replace(/[|;,]/g,'')}).join(',');
 var e=ST.exp.map(function(x){return [x.id||'',x.amt,x.by,x.who.join('.'),(x.note||'').replace(/[|;,]/g,' ')].join(',')}).join(';');
 return 'K5'+b64e(m+'|'+e+'|'+(ST.expDel||[]).join(','))}
function ledgerImport(code){
 code=(code||'').trim();
 if(code.indexOf('K5')!==0)return {ok:false,msg:'這不是分帳同步碼'};
 var raw=b64d(code.slice(2));if(raw===null)return {ok:false,msg:'同步碼壞了或不完整'};
 var parts=raw.split('|'),mm=parts[0].split(','),ee=(parts[1]||'').split(';');
 (parts[2]||'').split(',').forEach(function(id){if(id&&ST.expDel.indexOf(id)<0)ST.expDel.push(id)});
 if(ST.expDel.length)ST.exp=ST.exp.filter(function(x){return ST.expDel.indexOf(x.id)<0});
 var have={};ST.exp.forEach(function(x){if(x.id)have[x.id]=1});
 var added=0;
 ee.forEach(function(row){if(!row)return;var f=row.split(',');
  if(f.length<4)return;var id=f[0];if(!id||have[id]||ST.expDel.indexOf(id)>=0)return;
  ST.exp.push({id:id,amt:parseInt(f[1],10)||0,by:parseInt(f[2],10)||0,
   who:(f[3]||'').split('.').filter(function(x){return x!==''}).map(Number),note:f.slice(4).join(',')||''});
  added++});
 for(var i=0;i<5;i++){if(!ST.members[i]&&mm[i])ST.members[i]=mm[i]}
 save();return {ok:true,msg:'已合併 '+added+' 筆（重複的自動略過）'}}

/* ---- 前景死線提醒 ---- */
var NOTIFIED={};
function notifyOK(){return ('Notification' in window)&&Notification.permission==='granted'}
function askNotify(){
 if(!('Notification' in window))return toast('此瀏覽器不支援通知');
 if(Notification.permission==='granted')return toast('已經開啟了');
 Notification.requestPermission().then(function(p){
  if(p==='granted'){toast('已開啟 ・ App 開著時死線前 15 分鐘會提醒');checkNotify()}
  else toast('你拒絕了通知權限')})}
function checkNotify(){
 if(!notifyOK())return;
 var tk=todayKey();if(!tk)return;
 var nowM=dnorm(tk,nowMinFor(tk)),list=slotsOf(tk);
 list.forEach(function(s){
  if(!s.dead)return;var key=tk+':'+s.id,d=tnorm(tk,s.a)-nowM;
  if(d<=15&&d>0&&!NOTIFIED[key]){NOTIFIED[key]=1;
   try{var n=new Notification('🚨 '+d+' 分鐘後：'+s.t,{body:D[tk].label+' ・ '+s.a+' 開始 ・ 這是死線',tag:key,requireInteraction:false});
    if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}})}
setInterval(checkNotify,60000);
