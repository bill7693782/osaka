<style>
.fs-s{--fs:16px}
.fs-m{--fs:18px}
.fs-l{--fs:20.5px}
.fs-xl{--fs:23px}
/* ===== 深色主題 ===== */
.dark{
  --paper:#141A18; --paper2:#1E2724; --ink:#E8EDEB; --ink2:#A9B8B3; --dim:#7E8F89;
  --line:#2E3A36; --go:#3E9E85; --go-d:#5FBFA4; --red:#FF6B5E; --red-bg:#3A1F1C;
  --gold:#E0A755; --sea:#7FB3D9; --white:#1A2320;
}
.dark .card{box-shadow:inset 0 0 0 1px var(--line)}
.dark .card.warn{background:#3A1F1C;box-shadow:inset 0 0 0 1px #5C312C}
.dark .card.ok{background:#16332B;box-shadow:inset 0 0 0 1px #2A5449}
.dark .tag{background:#26302D;color:var(--ink2)}
.dark .tag.t-open{background:#1B4438;color:#7FDCC0}
.dark .tag.t-soon{background:#3D3320;color:#E8C88A}
.dark .tag.t-shut{background:#3A1F1C;color:#FF9B90}
.dark .plan{background:#1A2320;box-shadow:inset 0 0 0 1px var(--line)}
.dark .plan.hot{background:#3A1F1C;box-shadow:inset 0 0 0 1px #5C312C}
.dark input,.dark select,.dark textarea{background:#1A2320;color:var(--ink);border-color:var(--line)}
.dark .btn.sec{background:#1E2724;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.dark .tel{background:#1A2320;color:var(--sea)}
.dark .chip{background:#1A2320;color:var(--ink)}
.dark .chip.on{background:#1B4438;box-shadow:inset 0 0 0 2px var(--go)}
.dark .file{background:#26302D;color:var(--ink2)}
.dark .fsbar button,.dark .thbar button{background:#1A2320;color:var(--ink)}
.dark .fsbar button.on,.dark .thbar button.on{background:var(--go);color:#0E1614}
.dark mark{background:#4A3A18;color:#FFE0A3}
.dark .depbar{background:#0E1412;border-bottom-color:var(--go)}
.dark header{background:#0E1412}
/* 標頭與倒數在深色下要自己指定顏色，不能吃 --ink（深色時 --ink 是亮色但 header 底本來就深） */
.dark header h1{color:#E8EDEB}
.dark .depbar .dep-big{color:#E8EDEB}
.dark .depbar .dep-lab{color:#7E8F89}
.dark .depbar .dep-sub{color:#A9B8B3}
.dark .depbar .dep-dl{color:#A9B8B3;border-top-color:#243029}
.dark nav button{background:#1E2724;color:#A9B8B3}
.dark nav button.on{background:#E8EDEB;color:#141A18}
.dark .vbtn{background:#1E2724;color:#A9B8B3}
.dark .vbtn.ok{color:#7FDCC0}
.dark .sbtn{background:#1E2724;color:#A9B8B3}
.dark .clock{color:#A9B8B3}
.dark .clock b{color:#fff}
:root{
  --paper:#F2F4F3; --paper2:#E7EBE9; --ink:#16211E; --ink2:#4A5B55; --dim:#7C8C86;
  --line:#CFD8D4; --go:#1F6F5C; --go-d:#175443; --red:#B3261E; --red-bg:#FBEAE8;
  --gold:#C8842B; --sea:#24608C; --white:#FFFFFF;
  --sp:16px; --r:10px;
  --fs:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs); line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--sea)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 頂部 ── */
header{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.hrow h1{font-size:1.02em}
.clock{font-variant-numeric:tabular-nums;font-size:.86em;color:#B9C7C2;margin-left:10px}
.clock b{font-size:1.3em;color:#fff;letter-spacing:-.01em}
.clock b{color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:48px;padding:5px 13px;border-radius:12px;
  background:#2B3A35;color:#C9D6D1;font-size:.85em;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.2}
nav button .tsub{font-size:.72em;opacity:.65;font-weight:400}
nav button.on{background:var(--paper);color:var(--ink);font-weight:700}
nav button{position:relative}
nav button.today{background:var(--gold);color:#2A1B05;font-weight:700}
nav button.today.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}


/* ── 內容 ── */
main{padding:var(--sp) 14px 90px;max-width:720px;margin:0 auto}
.dayhead{margin-bottom:14px}
.dayhead .dt{font-size:.78em;color:var(--dim);font-variant-numeric:tabular-nums}
.dayhead h2{font-size:1.55em;line-height:1.24;margin:3px 0 5px;letter-spacing:-.025em;
  text-wrap:balance;word-break:break-word}
.dayhead h2.long{font-size:1.24em;line-height:1.3;letter-spacing:-.01em}
.dayhead .sub{font-size:.85em;color:var(--ink2)}

/* ── 時間軸 ── */
.rail{position:relative;padding-left:18px}
.rail::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:2px;background:var(--line)}
.slot{position:relative;padding:16px 0 18px}
.slot::before{content:"";position:absolute;left:-18px;top:22px;width:10px;height:10px;
  border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--go)}
.slot.dead::before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.slot.dead{background:var(--red-bg);margin:0 -12px 0 -12px;padding:16px 12px 18px 12px;border-radius:var(--r)}
.slot.dead::before{left:-6px}
.tm{font-variant-numeric:tabular-nums;font-size:.82em;color:var(--dim);letter-spacing:.02em}
.tm b{font-size:.94em;color:var(--ink)}
.tm .shift{color:var(--red);font-weight:700}
.st{font-size:1.1em;font-weight:700;line-height:1.38;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 0}
.tag{font-size:.76em;padding:3px 8px;border-radius:5px;background:var(--paper2);color:var(--ink2)}
.tag.t-warn{background:var(--red);color:#fff;font-weight:700}
.tag.t-open{background:#DEF0E8;color:var(--go-d);font-weight:700}
.tag.t-soon{background:#FDF0DC;color:#8A5A12;font-weight:700}
.tag.t-shut{background:var(--red-bg);color:var(--red);font-weight:700}
.x{margin:10px 0 0;font-size:.95em;line-height:1.7;color:var(--ink2)}
.x ul{margin:0;padding-left:19px}
.x li{margin:4px 0}
.x b{color:var(--ink)}
.deadline{margin:10px 0 0;font-size:.9em;font-weight:700;color:var(--red)}
.arrived{margin:9px 0 0;font-size:.82em;color:var(--go-d);font-weight:700}

/* ── 按鈕列 ── */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;align-items:center}
.btn{min-height:44px;padding:0 14px;border-radius:9px;font-size:.88em;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ico{width:48px;padding:0;font-size:1.05em}
.btn.go{background:var(--go);color:#fff}
.btn.sec{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.on{background:var(--go-d);color:#fff}
.more{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 0}
.more button,.more a{min-height:36px;padding:0 12px;border-radius:6px;font-size:.82em;
  background:var(--paper2);color:var(--ink2);display:inline-flex;align-items:center;text-decoration:none}
details{margin:9px 0 0}
details summary{min-height:34px;display:flex;align-items:center;
  font-weight:700;color:var(--go-d);cursor:pointer;font-size:.85em}
details .body{font-size:.92em;color:var(--ink2);padding:6px 0 0;line-height:1.65}
details ol{margin:0;padding-left:20px}
details li{margin:5px 0}

/* ── 通用區塊 ── */
.card{background:var(--white);border-radius:var(--r);padding:14px;margin:0 0 12px;
  box-shadow:inset 0 0 0 1px var(--line)}
.card h3{font-size:1.02em;margin:0 0 8px}
.note{font-size:.92em;color:var(--ink2);line-height:1.7}
.warn{background:var(--red-bg);box-shadow:inset 0 0 0 1px #E9C4C0}
.warn h3{color:var(--red)}
.ok{background:#E4F1EB;box-shadow:inset 0 0 0 1px #B9D9CC}
.sec-t{font-size:.8em;color:var(--dim);margin:20px 0 8px;font-weight:700}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font-size:1.05em;margin-bottom:5px}
.depbar{background:var(--ink);color:var(--paper);padding:12px 14px 14px;border-bottom:3px solid var(--go)}
.dep-lab{font-size:.72em;color:#8FA39D;letter-spacing:.08em}
.dep-big{font-size:1.75em;font-weight:700;line-height:1.15;margin:2px 0 4px;letter-spacing:-.02em}
.dep-sub{font-size:.82em;color:#B9C7C2;line-height:1.5}
.dep-dl{margin-top:8px;padding-top:8px;border-top:1px solid #2B3A35;font-size:.8em;color:#C9D6D1}
.dep-dl b{color:var(--gold)}
.dep-dl.hot b{color:#FF8A80}
.dep-dl.hot{color:#FFC9C4}
mark{background:#FDF0DC;color:var(--ink);padding:0 2px;border-radius:3px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{padding-right:10px}
.card.warn td:first-child{min-width:min(8.2em,42vw)}
table{table-layout:fixed}
td,th{overflow-wrap:anywhere;word-break:break-word}
@media (max-width:340px){
  .tel{padding:0 10px;font-size:.9em}
  .card.warn td:first-child{min-width:0}
}
th{color:var(--dim);font-weight:700;font-size:.85em}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px;border-radius:8px;
  border:1px solid var(--line);background:var(--white);color:var(--ink);width:100%}
label{font-size:.82em;color:var(--dim);display:block;margin:0 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:0 0 10px}
.row>div{flex:1 1 120px}
.mono{font-variant-numeric:tabular-nums}
.av{width:42px;height:42px;border-radius:50%;background:var(--go);color:#fff;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.62em;line-height:1.15;font-weight:700;flex:0 0 auto;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av .n{font-size:.52em;opacity:.85}
.av.sm{width:30px;height:30px;font-size:.78em}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:.78em;
  background:var(--paper2);color:var(--ink2)}
.paid{opacity:.45;text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:.92em;
  max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}

.fsbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fsbar,.thbar{margin-left:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.thbar button{min-width:76px;min-height:44px;border-radius:9px;background:var(--white);color:var(--ink);
  font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.thbar button.on{background:var(--go);color:#fff;box-shadow:none}
.fsbar button{min-width:56px;min-height:44px;border-radius:9px;background:var(--white);color:var(--ink);
  font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.fsbar button.on{background:var(--go);color:#fff;box-shadow:none}
.sbtn{width:44px;min-height:44px;border-radius:22px;background:#2B3A35;color:#C9D6D1;font-size:1em;margin-left:6px}
.vbtn{margin-left:auto;min-height:44px;padding:0 14px;border-radius:22px;font-size:.78em;
  font-weight:700;background:#2B3A35;color:#C9D6D1;white-space:nowrap;font-variant-numeric:tabular-nums}
.vbtn.ok{color:#8FD9BE}
.vbtn.warn{color:#D9C08F}
.vbtn.new{background:var(--gold);color:#2A1B05;animation:vpulse 1.6s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.55}}
.clock{margin-left:10px}
@media (prefers-reduced-motion:reduce){.vbtn.new{animation:none}}

/* 電話：不斷行、做成可按的樣子 */
.tel{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;
  border-radius:9px;background:var(--white);color:var(--sea);font-weight:700;
  text-decoration:none;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);
  font-variant-numeric:tabular-nums;max-width:100%}
.tel.urgent{background:var(--red);color:#fff;box-shadow:none;font-size:1.05em}
td .tel{margin:2px 0}
/* 勾選晶片 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;
  border-radius:20px;background:var(--white);color:var(--ink);font-size:.88em;
  box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.chip input{width:18px;height:18px;margin:0;flex:0 0 auto}
.chip.on{background:#DEF0E8;box-shadow:inset 0 0 0 2px var(--go)}
/* 檔案上傳 */
.file{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:9px;
  background:var(--paper2);color:var(--ink2);font-size:.85em;font-weight:700;cursor:pointer;white-space:nowrap}
.file input{display:none}
/* 大頭貼：名字移到圈外 */
.avwrap{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:7.4em}
.avwrap .nm{font-size:.85em;color:var(--ink2)}
.av{width:44px;height:44px;font-size:1em}
.av .n{display:none}
/* 備案分組 */
.grp{margin:22px 0 10px;font-size:.9em;font-weight:700;color:var(--ink)}
.grp span{font-weight:400;color:var(--dim);font-size:.86em}
.plan{background:var(--white);border-radius:var(--r);padding:13px 14px;margin:0 0 9px;
  box-shadow:inset 0 0 0 1px var(--line)}
.plan.hot{box-shadow:inset 0 0 0 1px #E9C4C0;background:var(--red-bg)}
.plan b{display:block;font-size:1.02em;margin-bottom:4px}
</style>
</head>

/* ===== 命名空間：所有 origin 層級的儲存都用 australia 前綴 ===== */
var LSKEY="australia_v1";
var BK_PREFIX="AUBK";   /* 備份碼 */
var LG_PREFIX="AULG";   /* 同步碼．與 AUBK 等長，不互為前綴 */
var FB_DB="https://australia-2026-40745-default-rtdb.asia-southeast1.firebasedatabase.app";
var FB_PATH="australia/rooms";

/* ===== 狀態 ===== */
var ST={members:["","","",""],avatars:["","","",""],
  adhoc:{},edit:{},hide:{},done:{},arr:{},
  exp:[],paid:{},diet:[],dietOn:[],
  shop:[],budget:0,pack:[],packHide:{},
  room:"",tab:"help",fs:"m",lastEdit:0,
  me:null,pos:{},geoOn:false,geoRate:1,
  q:"",myPlaces:[],expDel:[],theme:"auto"};
var CAN=false;
try{
  var raw=localStorage.getItem(LSKEY); if(raw) ST=Object.assign(ST,JSON.parse(raw));
  localStorage.setItem(LSKEY+"_probe","1"); localStorage.removeItem(LSKEY+"_probe"); CAN=true;
}catch(e){CAN=false}
/* ===== 壞資料防護（規格第三章）=====
   同步或舊備份可能帶進非預期型別。三十種壞狀態裡有十一種會讓分頁整頁掛掉。 */
function ensureST(){
  /* 物件欄位：不是物件、或誤成陣列，就重設 */
  ["adhoc","edit","hide","done","arr","paid","packHide","pos"].forEach(function(k){
    if(!ST[k]||typeof ST[k]!=="object"||Array.isArray(ST[k])) ST[k]={};
  });
  /* 陣列欄位：不是陣列就重設，並濾掉 null／undefined */
  ["exp","diet","dietOn","shop","pack","members","avatars","myPlaces","expDel"].forEach(function(k){
    if(!Array.isArray(ST[k])) ST[k]=[];
    ST[k]=ST[k].filter(function(x){ return x!==null&&x!==undefined });
  });
  /* 成員名單長度不對就補齊 */
  if(ST.members.length!==MEMBERS.length)
    ST.members=MEMBERS.map(function(_,i){ return (ST.members&&ST.members[i])||"" });
  if(ST.avatars.length!==MEMBERS.length)
    ST.avatars=MEMBERS.map(function(_,i){ return (ST.avatars&&ST.avatars[i])||"" });
  /* 索引類欄位超出範圍就重設 */
  if(ST.me!==null&&(typeof ST.me!=="number"||ST.me<0||ST.me>=MEMBERS.length)) ST.me=null;
  if(typeof ST.geoRate!=="number"||ST.geoRate<0||ST.geoRate>2) ST.geoRate=1;
  if(typeof ST.budget!=="number"||!isFinite(ST.budget)) ST.budget=0;
  if(typeof ST.fs!=="string"||["s","m","l","xl"].indexOf(ST.fs)<0) ST.fs="m";
  if(["auto","light","dark"].indexOf(ST.theme)<0) ST.theme="auto";
  if(typeof ST.room!=="string") ST.room="";
  /* 每一筆分帳都要有合法金額與付款人 */
  ST.exp=ST.exp.filter(function(e){
    if(!e||typeof e!=="object") return false;
    if(e.type==="each"){
      if(!Array.isArray(e.each)) return false;
      e.each=e.each.map(function(v){ return (typeof v==="number"&&isFinite(v))?v:0 });
      return true;
    }
    return typeof e.amt==="number"&&isFinite(e.amt);
  });
  ST.exp.forEach(function(e){
    if(typeof e.by!=="number"||e.by<0||e.by>=MEMBERS.length) e.by=0;
    if(e.type!=="each"&&!Array.isArray(e.with)) e.with=MEMBERS.map(function(_,i){return i});
    if(Array.isArray(e.with)) e.with=e.with.filter(function(i){
      return typeof i==="number"&&i>=0&&i<MEMBERS.length });
    if(typeof e.t!=="string") e.t="未命名";
  });
  /* 購物每筆要有品名 */
  ST.shop=ST.shop.filter(function(x){ return x&&typeof x==="object"&&typeof x.n==="string"&&x.n });
  ST.myPlaces=ST.myPlaces.filter(function(x){ return x&&typeof x==="object"&&typeof x.n==="string"&&x.n });
  ST.expDel=ST.expDel.filter(function(x){ return x&&typeof x==="object" });
  if(typeof ST.q!=="string") ST.q="";
  ST.shop.forEach(function(x){ if(typeof x.price!=="number"||!isFinite(x.price)) x.price=0 });
  /* 位置：每一筆都要有合法經緯度 */
  Object.keys(ST.pos).forEach(function(k){
    var v=ST.pos[k];
    if(!v||typeof v.lat!=="number"||typeof v.lng!=="number"||!isFinite(v.lat)||!isFinite(v.lng))
      delete ST.pos[k];
  });
}
ensureST();

function save(){ if(!CAN)return; ST.lastEdit=Date.now();
  try{ localStorage.setItem(LSKEY,JSON.stringify(ST)) }catch(e){ toast("儲存空間滿了，請刪掉一些照片") } }
function mem(i){ return ST.members[i]||("成員"+(i+1)) }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c] }) }
function toast(m){ var d=document.createElement("div"); d.className="toast"; d.textContent=m;
  document.body.appendChild(d); setTimeout(function(){ d.remove() },2600) }

/* ===== 時間 ===== */
function mins(hm){ if(!hm)return null; var p=String(hm).split(":"); return (+p[0])*60+(+p[1]) }
function fmt(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60),n=m%60;
  return (h<10?"0":"")+h+":"+(n<10?"0":"")+n }
/* 澳洲東部標準時間 UTC+10，2026/9 全程不換夏令時間 */
function auNow(){ var d=new Date(); return new Date(d.getTime()+(d.getTimezoneOffset()+600)*60000) }
function auMins(){ var d=auNow(); return d.getHours()*60+d.getMinutes() }
function auDateStr(){ var d=auNow(); return (d.getMonth()+1)+"/"+d.getDate() }
/* Day 0、Day 1 用台灣時間 */
function twNow(){ var d=new Date(); return new Date(d.getTime()+(d.getTimezoneOffset()+480)*60000) }
function dayUsesTW(id){ return id==="d0"||id==="d1" }
function nowFor(id){ return dayUsesTW(id)? (twNow().getHours()*60+twNow().getMinutes()) : auMins() }
function todayIs(dayDate){ return auDateStr()===dayDate }

/* ===== 行程格取用 ===== */
function slotKey(d,s){ return d.id+"|"+s.a+"|"+s.t }
function slotsOf(id){
  var d=DAYS.filter(function(x){return x.id===id})[0]; if(!d)return [];
  var base=d.slots.map(function(s,i){ var k=slotKey(d,s); var e=ST.edit[k]||{};
    return Object.assign({},s,e,{_k:k,_i:i}) });
  var add=(ST.adhoc[id]||[]).map(function(s,i){ return Object.assign({},s,{_k:d.id+"|+"+i,_i:1000+i,_add:1}) });
  return base.concat(add).filter(function(s){ return !ST.hide[s._k] })
    .sort(function(p,q){ return mins(p.a)-mins(q.a) });
}
/* ===== 營業時間判定（只在旅程當天） ===== */
function openState(s,dayDate){
  if(!todayIs(dayDate)) return null;
  var g=(s.g||[]).filter(function(t){ return t.indexOf("🕐")===0 })[0]; if(!g)return null;
  var m=g.match(/(\d{1,2}:\d{2})\s*[–\-~]\s*(\d{1,2}:\d{2})/); if(!m)return null;
  var o=mins(m[1]),c=mins(m[2]),n=auMins();
  if(n<o||n>=c) return {c:"t-shut",s:"🔴 現在沒開"};
  if(c-n<=60) return {c:"t-soon",s:"⏰ 快打烊了（"+(c-n)+" 分）"};
  return {c:"t-open",s:"🟢 現在營業中"};
}
/* ===== 落後推算 ===== */
function lagOf(id){
  var ss=slotsOf(id),lag=0;
  for(var i=0;i<ss.length;i++){ var a=ST.arr[ss[i]._k];
    if(a!=null){ var d=a-mins(ss[i].a); if(d>lag)lag=d } }
  return lag>=5? lag : 0;
}
/* ===== 導覽 ===== */
var TABS=[{k:"help",n:"使用說明",sub:"先看這個"}].concat(DAYS.map(function(d){return {k:d.id,n:"D"+d.id.slice(1)+" "+d.date}}))
  .concat([{k:"find",n:"搜尋",sub:"找行程"},{k:"split",n:"分帳",sub:"AUD"},{k:"shop",n:"購物",sub:"清單"},
          {k:"pack",n:"行李",sub:"打包"},{k:"info",n:"資訊",sub:"天氣・錢"},{k:"sos",n:"緊急",sub:"出事時"},
          {k:"plan",n:"備案",sub:"18 情境"},{k:"share",n:"分享",sub:"同步"},{k:"prep",n:"準備",sub:"成員"}]);
function isToday(k){ var d=DAYS.filter(function(x){return x.id===k})[0];
  return d? todayIs(d.date) : false }
function hasDead(id){ return /^d\d+$/.test(id) && slotsOf(id).some(function(s){return s.dead}) }
function renderNav(){
  document.getElementById("nav").innerHTML=TABS.map(function(t){
    var c=[]; if(ST.tab===t.k)c.push("on"); if(isToday(t.k))c.push("today");

    var dd=DAYS.filter(function(x){return x.id===t.k})[0];

    return '<button class="'+c.join(" ")+'" data-tab="'+t.k+'">'+esc(main)+
      (sub?'<span class="tsub">'+esc(sub)+'</span>':'')+'</button>';
  }).join("");
}
function go(k){ ST.tab=k; save(); render(); window.scrollTo(0,0); }

/* ===== 一格行程 ===== */

function avHTML(i,sm){ var a=ST.avatars[i];

function settle(){
  var bal=[0,0,0,0];
  ST.exp.forEach(function(e){
    if(e.type==="each"){ (e.each||[]).forEach(function(v,i){ bal[i]-=(+v||0) }); bal[e.by]+= (e.each||[]).reduce(function(a,b){return a+(+b||0)},0) }
    else { var sh=e.with.length? e.amt/e.with.length : 0;
      e.with.forEach(function(i){ bal[i]-=sh }); bal[e.by]+=e.amt }
  });
  var pos=[],neg=[];
  bal.forEach(function(v,i){ if(v>0.01)pos.push({i:i,v:v}); else if(v<-0.01)neg.push({i:i,v:-v}) });
  var out=[],gi=0,gj=0;
  while(gi<neg.length&&gj<pos.length){
    var m=Math.min(neg[gi].v,pos[gj].v);
    out.push({f:neg[gi].i,t:pos[gj].i,v:m}); neg[gi].v-=m; pos[gj].v-=m;
    if(neg[gi].v<0.01)gi++; if(pos[gj].v<0.01)gj++;
  }
  return out;
}

function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))) }
function b64d(s){ return JSON.parse(decodeURIComponent(escape(atob(s)))) }
function mkBackup(){ return BK_PREFIX+b64e(ST) }
function mkSync(){ return LG_PREFIX+b64e({exp:ST.exp,paid:ST.paid,shop:ST.shop,budget:ST.budget,
  members:ST.members,arr:ST.arr,edit:ST.edit,adhoc:ST.adhoc,hide:ST.hide,done:ST.done,pack:ST.pack,packHide:ST.packHide,pos:ST.pos}) }
function readCode(c){
  c=(c||"").trim();
  if(!c) return {ok:false,msg:"請先貼上代碼"};
  /* AUBK 與 AULG 等長且不互為前綴，但仍明確互擋，給清楚指引 */
  if(c.indexOf(BK_PREFIX)===0){
    try{ return {ok:true,kind:"backup",data:b64d(c.slice(BK_PREFIX.length))} }
    catch(e){ return {ok:false,msg:"備份代碼看起來不完整，請重新複製整段"} } }
  if(c.indexOf(LG_PREFIX)===0){
    try{ return {ok:true,kind:"sync",data:b64d(c.slice(LG_PREFIX.length))} }
    catch(e){ return {ok:false,msg:"同步代碼看起來不完整，請重新複製整段"} } }
  return {ok:false,msg:"這不是本 App 的代碼。備份碼以 "+BK_PREFIX+" 開頭，同步碼以 "+LG_PREFIX+" 開頭"};
}
function applyCode(c){
  var r=readCode(c); if(!r.ok){ toast(r.msg); return }
  if(r.kind==="backup"){
    if(!confirm("還原備份會覆蓋這支手機上的所有資料，確定？")){ toast("已取消，沒有變更任何資料"); return }
    ST=Object.assign(ST,r.data); save(); render(); toast("已還原備份"); return }
  merge(r.data); save(); render(); toast("已合併同步資料");
}
/* 合併：不比較兩支手機的時戳；我 90 秒內剛改過就留我的 */
function merge(rm){
  if(!rm||typeof rm!=="object") return;
  var mine=(Date.now()-(ST.lastEdit||0))<90000;
  ["exp","shop","pack"].forEach(function(k){ if(Array.isArray(rm[k])&&!mine) ST[k]=rm[k] });
  ["paid","arr","edit","adhoc","hide","done","packHide"].forEach(function(k){
    if(rm[k]&&typeof rm[k]==="object"){ if(mine) ST[k]=Object.assign({},rm[k],ST[k]); else ST[k]=Object.assign({},ST[k],rm[k]) } });
  if(Array.isArray(rm.members)&&!mine) ST.members=rm.members;
  if(typeof rm.budget==="number"&&!mine) ST.budget=rm.budget;
  if(rm.pos&&typeof rm.pos==="object") posMerge(rm.pos);
  ensureST();
}

var FBST="檢查中…";
function fbURL(){ return FB_DB.replace(/\/$/,"")+"/"+FB_PATH+"/"+encodeURIComponent(ST.room)+".json" }
function fbCheck(cb){
  if(!FB_DB){ FBST="⚪ 未設定 Firebase，只用同步碼"; cb&&cb(); return }
  var room=ST.room||"PROBE00000";
  fetch(FB_DB.replace(/\/$/,"")+"/"+FB_PATH+"/"+room+".json",{cache:"no-store"})
   .then(function(r){ return r.text().then(function(t){ return {s:r.status,t:t} }) })
   .then(function(o){
     if(o.s===200) FBST="🟢 即時同步正常";
     else if(/Permission denied/i.test(o.t)) FBST="🔴 資料庫規則沒設對（見下方 JSON）";
     else FBST="🟠 Firebase 回應 "+o.s+"："+o.t.slice(0,80);
     cb&&cb() })
   .catch(function(){ FBST="⚪ 目前離線，用同步碼"; cb&&cb() });
}

   .catch(function(){ toast("目前離線，改用同步碼") }) }

/* ===== ICS 匯出（RFC 5545） ===== */
/* 澳洲東部標準時間 UTC+10，2026/9 全程不換夏令時間；Day0/Day1 用台灣 UTC+8 */
function icsEsc(s){ return String(s==null?"":s)
  .replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n") }
/* RFC 5545 §3.1：內容行不得超過 75 octet，續行以單一空白開頭 */
function icsFold(line){
  /* 依「字元」迭代，不是 code unit —— emoji 是代理對，逐 code unit 切會產生孤立代理對 */
  var chars = Array.from ? Array.from(line) : line.split("");
  var out=[], cur="", n=0;
  for(var i=0;i<chars.length;i++){
    var ch=chars[i], w;
    try{ w=unescape(encodeURIComponent(ch)).length }catch(e){ w=4 }
    if(n+w>73){
      out.push(cur);
      /* 折行標記本身就是一個空白；若內容剛好在此處是空白，吞掉它，
         避免解析器移除折行空白後留下多餘空格（RFC 5545 §3.1） */
      if(ch===" "){ cur=" "; n=1 } else { cur=" "+ch; n=1+w }
    } else { cur+=ch; n+=w }
  }
  out.push(cur); return out.join("\r\n");
}
function pad(v){ return (v<10?"0":"")+v }
/* 把某天某時刻換算成 UTC 的 YYYYMMDDTHHMMSSZ */
function icsUTC(dayDate,hm,tzOffsetHours){
  var mo=+dayDate.split("/")[0], da=+dayDate.split("/")[1];
  var h=+hm.split(":")[0], mi=+hm.split(":")[1];
  var t=Date.UTC(2026,mo-1,da,h-tzOffsetHours,mi,0);
  var d=new Date(t);
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";
}
function icsStamp(){ var d=new Date();
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z" }
/* UID 唯一：命名空間＋日＋時刻＋序號 */
function icsUID(dayId,i,a){ return "au2026-"+dayId+"-"+i+"-"+a.replace(":","")+"@australia.trip" }
function buildICS(){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//australia//trip v001//ZH-TW",
         "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:澳洲之旅","X-WR-TIMEZONE:Australia/Melbourne"];
  var stamp=icsStamp();
  DAYS.forEach(function(d){
    var tz=dayUsesTW(d.id)?8:10;
    slotsOf(d.id).forEach(function(s,i){
      var st=icsUTC(d.date,s.a,tz);
      var endHM=s.b||s.a;
      /* 跨日（如 20:05 → 07:20）：結束時間落在隔天 */
      var crossDay = mins(endHM)<mins(s.a);
      var da=+d.date.split("/")[1] + (crossDay?1:0);
      var en=icsUTC(d.date.split("/")[0]+"/"+da,endHM,tz);
      if(en===st) en=icsUTC(d.date,fmt(mins(s.a)+30),tz);
      var desc=(s.x||"").replace(/<li>/g,"・").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      if(s.dead) desc="【死線】"+s.dead+" ／ "+desc;
      L.push("BEGIN:VEVENT");
      L.push("UID:"+icsUID(d.id,i,s.a));
      L.push("DTSTAMP:"+stamp);
      L.push("DTSTART:"+st);
      L.push("DTEND:"+en);
      L.push("SUMMARY:"+icsEsc(s.t));
      if(desc) L.push("DESCRIPTION:"+icsEsc(desc.slice(0,700)));
      if(s.q) L.push("LOCATION:"+icsEsc(s.q));
      if((s.g||[]).length) L.push("CATEGORIES:"+icsEsc(s.g.join(",")));
      if(s.dead){ L.push("BEGIN:VALARM"); L.push("TRIGGER:-PT30M");
        L.push("ACTION:DISPLAY"); L.push("DESCRIPTION:"+icsEsc("30 分鐘後："+s.t)); L.push("END:VALARM") }
      L.push("END:VEVENT");
    });
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
function dlICS(){
  var t=buildICS(), b=new Blob([t],{type:"text/calendar;charset=utf-8"});
  var u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download="australia-2026.ics"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(u) },1000);
  toast("行事曆檔已下載，用行事曆 App 開啟即可匯入");
}

/* ===== 版本與更新（依規格：抓 sw.js 讀 CACHE，繞過 SW 生命週期）===== */
var APP_VER="025";
var APPVER="australia-v25";            /* 與 sw.js 的 CACHE 一致 */
var VST={state:"...",note:"",latest:null};   /* ok / new / warn / ... */

/* 直接抓 sw.js（約 3 KB），讀它的 CACHE 版本。
   不抓 index.html —— 那是 126 KB，每次檢查差 42 倍流量。 */
function serverVer(cb){
  var done=false;
  function fin(v){ if(!done){ done=true; cb(v) } }
  setTimeout(function(){ fin(null) },6000);          /* 逾時保護 */
  try{
    fetch("sw.js?_="+Date.now(),{cache:"no-store"})  /* 時間戳＋no-store 雙重繞快取 */
     .then(function(r){ return r.ok? r.text() : null })
     .then(function(t){ var m=t&&/CACHE='([^']+)'/.exec(t); fin(m?m[1]:null) })
     .catch(function(){ fin(null) });
  }catch(e){ fin(null) }
}
/* 沒網路時的退路：問 Service Worker 自己的 CACHE */
function swVer(cb){
  var done=false;
  function fin(v){ if(!done){ done=true; cb(v) } }
  setTimeout(function(){ fin(null) },3000);
  try{
    if(!navigator.serviceWorker||!navigator.serviceWorker.controller) return fin(null);
    var ch=new MessageChannel();
    ch.port1.onmessage=function(ev){ fin(ev.data||null) };
    navigator.serviceWorker.controller.postMessage({type:"VER"},[ch.port2]);
  }catch(e){ fin(null) }
}
/* 🚨 旗標必須放在 VST 外面 —— setVst 每次都重建 VST，放裡面會被沖掉，
   結果每檢查一次就跳一次 toast，切出去切回來幾次就洗版。 */
var _newAlerted=null;      /* 記住已提醒過哪一版 */
function setVst(st,note,latest){
  VST={state:st,note:note||"",latest:latest||null};
  paintVer();
  if(st==="new"){
    /* 同一個新版本只提醒一次；出現「更新的新版」時才再提醒 */
    if(_newAlerted!==latest){
      _newAlerted=latest;
      try{ if(navigator.vibrate) navigator.vibrate(180) }catch(e){}
      toast("有新版本，點右上角的版本鈕更新");
    }
  } else if(st==="ok"){
    _newAlerted=null;      /* 更新完成後重置，下次有新版才會再提醒 */
  }
}
function refreshVst(){
  if(location.protocol==="file:") return setVst("warn","離線關");
  serverVer(function(sv){
    if(sv) return setVst(sv===APPVER?"ok":"new", sv===APPVER?"✅":"", sv);
    /* 問不到伺服器：退回比對 Service Worker，至少不誤報 */
    if(!("serviceWorker" in navigator)) return setVst("warn","離線關");
    swVer(function(v){
      if(v) return setVst(v===APPVER?"ok":"new", v===APPVER?"✅":"", v);
      /* 首次載入沒有 controller，頁面直接來自網路，就是最新版 */
      if(!navigator.serviceWorker.controller) return setVst("ok","✅",APPVER);
      setVst("warn","離線");
    });
  });
}
function hasUpdate(){ return VST.state==="new" }
function verLabel(){
  if(VST.state==="new") return "✨ 有新版";
  if(VST.state==="ok")  return "v"+APP_VER+" ✅";
  if(VST.state==="warn")return "v"+APP_VER+" "+(VST.note||"離線");
  return "v"+APP_VER+" ⋯";
}
function paintVer(){
  var b=document.getElementById("vbtn"); if(!b)return;
  b.className="vbtn "+VST.state;
  b.textContent=verLabel();
  b.title = VST.state==="new" ? "有新版，點一下更新" : "版本 ・ 點一下檢查更新";
}
/* 硬重載：時間戳繞快取，replace 不留歷史 */
function hardReload(){
  var u=location.pathname+"?u="+Date.now()+location.hash;
  try{ location.replace(u) }catch(e){ location.reload() }
}
function doUpdate(){
  /* 🚨 離線時不能先刪快取再重載，會把 App 清成空白且救不回來 */
  if(navigator.onLine===false){ toast("目前離線，連上網路後再更新"); return }
  toast("更新中，請稍候…");
  if(!("serviceWorker" in navigator)) return hardReload();
  navigator.serviceWorker.getRegistration().then(function(r){
    if(!r) return hardReload();
    var w=r.waiting||r.installing;
    if(w&&w.postMessage){
      try{ w.postMessage({type:"SKIP_WAITING"}) }catch(e){}
      return setTimeout(hardReload,500);
    }
    /* 還沒有新的 SW：先叫它去抓，抓到再重載 */
    r.update().then(function(){
      var w2=r.waiting||r.installing;
      if(w2&&w2.postMessage){ try{ w2.postMessage({type:"SKIP_WAITING"}) }catch(e){} }
      setTimeout(hardReload,600);
    }).catch(hardReload);
  }).catch(hardReload);
}

/* ===== 位置共享（規格第二章） =====
   誠實面對限制：網頁 App 拿不到背景定位，Service Worker 沒有 geolocation 介面。
   所以只做「開著 App 時」的互相共享，並明白告訴使用者要背景請用 Google 地圖。 */
var GEORATE=[[5000,"即時","5 秒"],[20000,"省電","20 秒"],[60000,"超省電","1 分鐘"]];
var MYPOS=null, GEOERR="", GEOWATCH=null, GEOTIMER=null;
function geoMs(){ return GEORATE[(ST.geoRate|0)%GEORATE.length][0] }
function geoName(){ return GEORATE[(ST.geoRate|0)%GEORATE.length][1] }
function geoEvery(){ return GEORATE[(ST.geoRate|0)%GEORATE.length][2] }

function geoStart(){
  if(!navigator.geolocation){ GEOERR="unsupported"; render(); return }
  ST.geoOn=true; save(); geoTick();
  if(GEOTIMER) clearInterval(GEOTIMER);
  GEOTIMER=setInterval(geoTick, geoMs());
  render();
}
function geoStop(){
  ST.geoOn=false; save();
  if(GEOTIMER){ clearInterval(GEOTIMER); GEOTIMER=null }
  MYPOS=null;
  if(ST.me!=null) delete ST.pos[ST.me];
  posDelete();            /* 立刻刪掉雲端那一筆，其他人就看不到了 */
  save(); render();
}
function geoTick(){
  if(!ST.geoOn||!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(p){
    GEOERR="";
    MYPOS={lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()};
    if(ST.me!=null) ST.pos[ST.me]=MYPOS;
    save(); posPush(); posPull();
    if(ST.tab==="sos"||ST.tab==="prep") render();
  },function(e){
    /* 空的錯誤回呼是最糟的 —— 使用者開了卻沒位置，完全不知道發生什麼事 */
    GEOERR=(e&&e.code===1)?"denied":((e&&e.code===3)?"timeout":"fail");
    if(ST.tab==="sos"||ST.tab==="prep") render();
  },{enableHighAccuracy:false, maximumAge:Math.max(4000,geoMs()-1000), timeout:8000});
}
/* 位置走專屬節點，不跟主資料一起送（實測差 120 倍流量） */
function posPush(){
  if(!FB_DB||!ST.room||ST.me==null||!MYPOS) return;
  fetch(FB_DB.replace(/\/$/,"")+"/"+FB_PATH+"/"+encodeURIComponent(ST.room)+"/pos/"+ST.me+".json",
   {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(MYPOS)})
  .catch(function(){});
}
function posDelete(){
  if(!FB_DB||!ST.room||ST.me==null) return;
  fetch(FB_DB.replace(/\/$/,"")+"/"+FB_PATH+"/"+encodeURIComponent(ST.room)+"/pos/"+ST.me+".json",
   {method:"DELETE"}).catch(function(){});
}
function posPull(){
  if(!FB_DB||!ST.room) return;
  fetch(FB_DB.replace(/\/$/,"")+"/"+FB_PATH+"/"+encodeURIComponent(ST.room)+"/pos.json",
   {cache:"no-store"}).then(function(r){ return r.json() })
  .then(function(j){ posMerge(j); if(ST.tab==="sos") render() })
  .catch(function(){});
}
/* 合併規則：別人的只取比較新的；自己的不覆蓋；型別防呆 */
function posMerge(remote){
  if(!remote||typeof remote!=="object") return;
  for(var i=0;i<MEMBERS.length;i++){
    if(i===ST.me) continue;                       /* 自己的最準，不覆蓋 */
    var v=remote[i];
    if(!v||typeof v!=="object") continue;
    if(typeof v.lat!=="number"||typeof v.lng!=="number") continue;   /* 型別防呆 */
    if(!isFinite(v.lat)||!isFinite(v.lng)) continue;
    var at=(typeof v.at==="number")?v.at:0;
    var cur=ST.pos[i];
    if(!cur||typeof cur.at!=="number"||at>cur.at) ST.pos[i]={lat:v.lat,lng:v.lng,at:at};
  }
  save();
}
function distM(a,b){
  if(!a||!b) return null;
  var R=6371000,p=Math.PI/180;
  var x=0.5-Math.cos((b.lat-a.lat)*p)/2+
    Math.cos(a.lat*p)*Math.cos(b.lat*p)*(1-Math.cos((b.lng-a.lng)*p))/2;
  return Math.round(2*R*Math.asin(Math.sqrt(x)));
}
function agoTxt(t){
  if(!t) return "";
  var s=Math.floor((Date.now()-t)/1000);
  if(s<60) return "剛剛";
  if(s<3600) return Math.floor(s/60)+" 分鐘前";
  return Math.floor(s/3600)+" 小時前";
}

  var mine=ST.me!=null? ST.pos[ST.me] : null;
  var rows=MEMBERS.map(function(_,i){
    var v=ST.pos[i];

      return '<tr><td>'+av+' '+esc(mem(i))+'</td><td colspan="2" class="note">⚪ 未開啟</td></tr>';
    }
    var old=(Date.now()-(v.at||0))>600000;         /* 超過 10 分鐘視為過舊 */
    var d=(i===ST.me)?null:distM(mine,v);
    var where=(i===ST.me)?"📍 我":
      (d==null? "📍 已分享" : (old?"⚠️ ":"📍 ")+(d>=1000?(d/1000).toFixed(1)+" km":d+" m"));
    return '<tr'+(old?' style="color:var(--gold)"':'')+'>'+
      '<td>'+av+' '+esc(mem(i))+'</td>'+

      '<td>'+(i===ST.me?'':'<button class="btn sec" data-nav="'+v.lat+','+v.lng+'">帶我去</button>')+'</td></tr>';
  }).join("");
  return '<table>'+rows+'</table>';
}

/* ===== 天氣穿搭建議 ===== */
function wearAdvice(lo,hi,rain,uv){
  var a=[];
  if(hi==null) return "";
  if(hi<14) a.push("<b>厚外套</b>必備");
  else if(hi<19) a.push("<b>薄外套或針織衫</b>");
  else if(hi<24) a.push("長袖或薄長袖");
  else a.push("短袖就夠");
  if(lo!=null&&hi-lo>=10) a.push("<b>早晚溫差 "+Math.round(hi-lo)+" 度，洋蔥式穿法</b>");
  if(lo!=null&&lo<10) a.push("清晨很冷，<b>加圍巾或毛帽</b>");
  if(rain!=null&&rain>=50) a.push("<b>降雨機率 "+rain+"%，帶傘</b>");
  else if(rain!=null&&rain>=30) a.push("可能有雨，帶折傘");
  if(uv!=null&&uv>=6) a.push("<b>UV "+Math.round(uv)+"，防曬帽子太陽眼鏡</b>");
  else if(uv!=null&&uv>=3) a.push("UV "+Math.round(uv)+"，擦防曬");
  return a.join("・");
}

function say(txt,lang){
  if(!("speechSynthesis" in window)){ toast("這支手機不支援朗讀"); return }
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(txt); u.lang=lang||"zh-TW"; u.rate=.95;
  speechSynthesis.speak(u);
}
function sayerSlot(k){
  var s=null; DAYS.forEach(function(d){ slotsOf(d.id).forEach(function(x){ if(x._k===k)s=x }) });
  if(!s)return;
  var t=s.a+" 到 "+(s.b||"")+"，"+s.t+"。";
  (s.g||[]).forEach(function(g){ t+=g.replace(/[🕐🚨💴✅⚠️👔]/g,"")+"。" });
  if(s.dead) t+="死線："+s.dead+"。";
  var plain=(s.x||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  t+=plain.slice(0,300);
  say(t);
}
