.store.off{background:rgba(228,87,74,.12);color:#F09A90;border:1px solid rgba(228,87,74,.3)}
.exp{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:7px}

.mem{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.mem input{flex:1;background:var(--ground);border:1px solid var(--line);color:var(--paper);border-radius:3px;padding:9px 10px;font-size:14px;font-family:inherit}
.mem span{color:var(--dim);font-size:13px;width:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--paper);color:var(--ground);padding:10px 18px;border-radius:4px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88%;text-align:center}
.toast.on{opacity:1}
footer{color:var(--dim);font-size:12px;text-align:center;padding:28px 0 10px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>

/* 去掉 emoji 與符號，避免被逐字唸出來 */
function stripEmoji(t){
 return String(t).replace(/[\u2190-\u21FF\u2300-\u27BF\u2B00-\u2BFF\uFE0F\u200D]/g,'')
   .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,'').replace(/\s+/g,' ').trim()}

/* 語音清單是非同步載入的，一定要等它就緒 */
function loadVoices(cb){
 var v=speechSynthesis.getVoices()||[];
 if(v.length){VOICES=v;VREADY=true;return cb&&cb()}
 var done=false;
 function fin(){if(done)return;done=true;VOICES=speechSynthesis.getVoices()||[];VREADY=true;cb&&cb()}
 try{speechSynthesis.onvoiceschanged=fin}catch(e){}
 setTimeout(fin,600)}

function pickVoice(){
 if(ST.voice){
  var pinned=VOICES.filter(function(x){return x.name===ST.voice})[0];
  if(pinned)return pinned}
 var pri=[
  function(x){return /^zh[-_]TW$/i.test(x.lang)},
  function(x){return /^(cmn|zh)[-_]?(Hant|TW|HK|MO)/i.test(x.lang)},
  function(x){return /(Ting-?Ting|Mei-?Jia|Sin-?Ji|國語|台灣|臺灣|中文|Chinese \(Taiwan\)|Chinese \(Traditional\))/i.test(x.name)},
  function(x){return /^zh/i.test(x.lang)},
  function(x){return /(Chinese|Mandarin|普通话|普通話)/i.test(x.name)}];
 for(var i=0;i<pri.length;i++){var m=VOICES.filter(pri[i])[0];if(m)return m}
 return null}

function speak(txt,id){
 if(!speakSupported())return toast('這個瀏覽器不支援語音朗讀');
 if(SPK.cur===id&&speechSynthesis.speaking){speechSynthesis.cancel();SPK.cur=null;render();return}
 speechSynthesis.cancel();
 loadVoices(function(){
  var v=pickVoice();
  if(!v){toast('找不到中文語音<br><span style="font-weight:400">到「準備」分頁看安裝方式</span>');return}
  var clean=stripEmoji(txt);
  /* 長句切段，避免部分瀏覽器攔腰截斷 */
  var chunks=clean.split(/(?<=[。！？；\n])/).filter(function(x){return x.trim()});
  if(!chunks.length)chunks=[clean];
  var merged=[],buf='';
  chunks.forEach(function(c){
   if((buf+c).length>140){if(buf)merged.push(buf);buf=c} else buf+=c});
  if(buf)merged.push(buf);
  SPK.cur=id;
  merged.forEach(function(c,i){
   var u=new SpeechSynthesisUtterance(c);
   u.voice=v;u.lang=v.lang||'zh-TW';u.rate=0.95;u.pitch=1;u.volume=1;
   if(i===merged.length-1)u.onend=function(){SPK.cur=null;if(cur.charAt(0)==='d')render()};
   u.onerror=function(){SPK.cur=null};
   speechSynthesis.speak(u)});
  if(cur.charAt(0)==='d')render()})}

function slotSpeech(x){
 var t=stripEmoji(stripTag(x.t));
 var parts=[x.a+' 到 '+x.b+'，'+t];
 if(x.g&&x.g.length)parts.push('重點：'+x.g.join('、'));
 if(x.pic)parts.push('拍照重點：'+stripEmoji(stripTag(x.pic)));
 if(x.x)parts.push(stripEmoji(stripTag(x.x)));
 return parts.join('。')}

/* 開頁就先暖機，讓語音清單提早載入 */
if(speakSupported())loadVoices();

function initialOf(i){
 var n=(ST.members[i]||'').trim();
 if(!n)return String(i+1);
 var m=n.match(/[A-Za-z]/);
 if(m&&/^[A-Za-z]/.test(n))return n.slice(0,2).toUpperCase();
 return n.slice(-1);
}

function pickAvatarTemp(file){
 if(!file)return;var fr=new FileReader();
 fr.onload=function(){var im=new Image();im.onload=function(){
  var c=document.createElement('canvas'),n=96;c.width=n;c.height=n;var g=c.getContext('2d');
  var side=Math.min(im.width,im.height);

  TEMPAV=c.toDataURL('image/jpeg',0.7);
  refreshPreview();
  toast('照片已選好，按「開始使用」就會存起來')};im.src=fr.result};

/* ---- 匯率（JPY → TWD，免金鑰） ---- */
function rateVal(){return ST.rate&&ST.rate.v?ST.rate.v:0}
function fmtNT(n){return 'NT$'+Math.round(n).toLocaleString()}
function fmtJP(n){return '¥'+Math.round(n).toLocaleString()}
function toJPY(e){var r=e.rate||rateVal();
 if(e.cur==='TWD')return r?e.amt/r:e.amt*5;return e.amt}
function rateAge(){if(!ST.rate.at)return '';
 var h=Math.floor((Date.now()-ST.rate.at)/3600000);
 if(h<1)return '剛剛更新';if(h<24)return h+' 小時前';return Math.floor(h/24)+' 天前'}
function fetchRate(cb){
 if(ST.rate.manual)return cb&&cb(null);
 fetch('https://open.er-api.com/v6/latest/JPY').then(function(r){return r.json()})
 .then(function(o){
  if(o&&o.rates&&o.rates.TWD){ST.rate={v:o.rates.TWD,at:Date.now(),manual:false};save();
   if(cur==='split')renderSplit();cb&&cb(null)}
  else cb&&cb('bad')})
 .catch(function(){cb&&cb('offline')})}

/* ---- 即時同步房間（Firebase Realtime Database） ---- */
/* 在下面填入你的 Firebase databaseURL，例如：
   var FB_DB="https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app";
   沒填就自動隱藏即時同步，只用離線同步碼。 */
var FB_DB="https://kansai-a631b-default-rtdb.asia-southeast1.firebasedatabase.app";

var SYNCING=false,LASTPULL=0,FBPOLL=null;
function fbReady(){return !!FB_DB && !!ST.room}
function fbURL(){return FB_DB.replace(/\/$/,'')+'/rooms/'+ST.room+'.json'}
function roomPayload(){return {v:1,members:ST.members,exp:ST.exp,at:Date.now()}}
function mergeRoom(o){
 if(!o)return 0;
 var have={};ST.exp.forEach(function(x){if(x.id)have[x.id]=1});
 var n=0,list=o.exp||[];
 if(!Array.isArray(list))list=Object.keys(list).map(function(k){return list[k]});
 list.forEach(function(x){if(x&&x.id&&!have[x.id]){ST.exp.push(x);n++}});
 if(o.members)for(var i=0;i<5;i++){if(!ST.members[i]&&o.members[i])ST.members[i]=o.members[i]}
 if(o.shops){ST.shopAll=o.shops;
  /* 若雲端有自己的清單而本機是空的（換裝置），拉回來 */
  if(ST.me!==null&&(!ST.shop||!ST.shop.length)&&o.shops[ST.me]&&o.shops[ST.me].length)ST.shop=o.shops[ST.me]}
 save();return n}
function roomCreate(cb){
 if(!FB_DB)return cb('no-config');
 var id=Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,6);
 ST.room=id;
 fetch(fbURL(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(roomPayload())})
 .then(function(r){if(!r.ok)throw 0;save();cb(null,id)})
 .catch(function(){ST.room='';cb('write-fail')})}
function roomPush(cb){
 if(!fbReady())return cb&&cb('no-room');
 /* PATCH 只覆蓋自己負責的欄位，不會清掉別人的購物清單 */
 fetch(fbURL(),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(roomPayload())})
 .then(function(r){
   if(ST.me===null)return r;
   return fetch(FB_DB.replace(/\/$/,'')+'/rooms/'+ST.room+'/shops/'+ST.me+'.json',
    {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(ST.shop||[])}).then(function(){return r})})
 .then(function(r){cb&&cb(r&&r.ok?null:'push-fail')}).catch(function(){cb&&cb('offline')})}
function roomPull(cb){
 if(!fbReady())return cb&&cb('no-room',0);
 fetch(fbURL()).then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(o){var n=mergeRoom(o);LASTPULL=Date.now();cb&&cb(null,n)})
 .catch(function(){cb&&cb('offline',0)})}
function roomSync(silent){
 if(!fbReady()||SYNCING)return;SYNCING=true;
 roomPull(function(e,n){
  if(e){SYNCING=false;if(!silent)toast('同步失敗 ・ 檢查網路');return}
  roomPush(function(){SYNCING=false;
   if(cur==='split')renderSplit();else if(cur==='shop')renderShop();
   if(!silent)toast(n?('已同步 ・ 收到 '+n+' 筆新紀錄'):'已同步 ・ 沒有新紀錄')})})}
FBPOLL=setInterval(function(){if(fbReady()&&(cur==='split'||cur==='shop'))roomSync(true)},10000);

/* ---- 分帳同步碼 ---- */
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/=+$/,'')}
function b64d(str){try{return decodeURIComponent(escape(atob(str)))}catch(e){return null}}
function ledgerCode(){
 var m=ST.members.map(function(x){return (x||'').replace(/[|;,]/g,'')}).join(',');
 var e=ST.exp.map(function(x){return [x.id||'',x.amt,x.by,x.who.join('.'),(x.note||'').replace(/[|;,]/g,' ')].join(',')}).join(';');
 return 'K5'+b64e(m+'|'+e)}
function ledgerImport(code){
 code=(code||'').trim();
 if(code.indexOf('K5')!==0)return {ok:false,msg:'這不是分帳同步碼'};
 var raw=b64d(code.slice(2));if(raw===null)return {ok:false,msg:'同步碼壞了或不完整'};
 var parts=raw.split('|'),mm=parts[0].split(','),ee=(parts[1]||'').split(';');
 var have={};ST.exp.forEach(function(x){if(x.id)have[x.id]=1});
 var added=0;
 ee.forEach(function(row){if(!row)return;var f=row.split(',');
  if(f.length<4)return;var id=f[0];if(!id||have[id])return;
  ST.exp.push({id:id,amt:parseInt(f[1],10)||0,by:parseInt(f[2],10)||0,
   who:(f[3]||'').split('.').filter(function(x){return x!==''}).map(Number),note:f.slice(4).join(',')||''});
  added++});
 for(var i=0;i<5;i++){if(!ST.members[i]&&mm[i])ST.members[i]=mm[i]}
 save();return {ok:true,msg:'已合併 '+added+' 筆（重複的自動略過）'}}

  var full=ST.avatars;ST.avatars=["","","","",""];
  var code=backupCode();ST.avatars=full;
  var box=document.getElementById('bkbox');
  box.innerHTML='<div class="form" style="border-style:solid"><div style="word-break:break-all;font-size:11px;color:var(--dim);background:var(--ground);padding:9px;border-radius:3px;max-height:120px;overflow:auto">'+code+'</div>'+
   '<div class="tags" style="margin-top:9px"><button class="lk map" id="bkcp">複製代碼</button></div>'+
   '<div class="hint"><b>短代碼不含大頭貼</b>（約 '+Math.max(1,Math.round(code.length/1024))+' KB），適合貼到備忘錄。要完整備份請用「下載備份檔」。</div></div>';
  document.getElementById('bkcp').onclick=function(){
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(function(){toast('已複製備份代碼')});
   else toast('請長按上面的代碼手動複製')}};
 var br=document.getElementById('bkrs');
 if(br)br.onclick=function(){var c=prompt('貼上備份代碼');if(!c)return;
  if(!confirm('還原會覆蓋這支手機目前的資料，確定嗎？'))return;
  var r=backupRestore(c);toast(r.msg);if(r.ok)render()};
 var rn2=document.getElementById('renme');
 if(rn2)rn2.onclick=function(){var v=prompt('改成什麼名字？',meName());
  if(v&&v.trim()){ST.members[ST.me]=v.trim();save();renderPrep();toast('已改名');if(ST.room)roomSync(true)}};
 var cm=document.getElementById('chgme');
 if(cm)cm.onclick=function(){if(confirm('重新登入？本機的行程調整與購物清單會保留。')){ST.me=null;save();cur='help';render()}};
 var an=document.getElementById('asknoti');
 if(an)an.onclick=askNotify;
 var ai=document.getElementById('allics');
 if(ai)ai.onclick=allDeadICS;
 var al=alarmList();
 var atxt='關西五日 死線鬧鐘\n（時間為日本時間，建議提前 15–30 分鐘設）\n\n'+
  al.map(function(x){return '11/'+x.d+'  '+x.t+'  '+x.n}).join('\n');
 var ca=document.getElementById('cpalarm');
 if(ca)ca.onclick=function(){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(atxt).then(function(){toast('已複製 '+al.length+' 個死線時間')});
  else toast('請用「看清單」手動選取')};
 var sa2=document.getElementById('shalarm');
 if(sa2)sa2.onclick=function(){var bx=document.getElementById('alarmbox');
  if(bx.innerHTML){bx.innerHTML='';return}
  bx.innerHTML='<div class="form" style="border-style:solid">'+
   al.map(function(x){return '<div class="bal"><span class="p mono">11/'+x.d+' '+x.t+'</span><span style="font-size:13px;text-align:right">'+x.n+'</span></div>'}).join('')+
   '<div class="hint">共 '+al.length+' 個死線。<b>Day 2 那個 14:31 建議設提前 30 分鐘</b> —— 那時你們正在走 1.5 公里海邊路。</div></div>'};
 var sa=document.getElementById('setalb');
 if(sa)sa.onclick=function(){var u=prompt('貼上共享相簿連結',ST.album||'');
  if(u&&/^https?:\/\//.test(u)){ST.album=u;save();renderPrep();toast('已設定')}else if(u)toast('請貼完整網址')};
 var ca=document.getElementById('clralb');
 if(ca)ca.onclick=function(){ST.album='';save();renderPrep()};
 window.scrollTo(0,0)}

document.getElementById('fstore').textContent=CAN?'儲存已啟用':'下載後用瀏覽器開啟才能保存';
var qEl=document.getElementById('q');
var qxEl=document.getElementById('qx');
if(qEl){var qT=null;qEl.oninput=function(){
  if(qxEl)qxEl.style.display=qEl.value?'block':'none';
  clearTimeout(qT);qT=setTimeout(render,250)}}
if(qxEl)qxEl.onclick=function(){qEl.value='';qxEl.style.display='none';render()};
setInterval(updLive,30000);

render();fetchWX();fetchRate();
if('serviceWorker' in navigator && location.protocol!=='file:'){
 window.addEventListener('load',function(){
  navigator.serviceWorker.register('sw.js').catch(function(){})})}
